    const DOCS_DATA = {"readme": {"metadata": {"id": "readme", "category": "소개 & 가이드", "category_icon": "📌", "title": "프로젝트 개요 (README)", "file_path": "README.md", "url_path": "../README.md", "desc": "프로젝트 목표, 디렉토리 구조 및 AI 워크플로우 종합 안내"}, "content": "# 📝 AI Blog Notes (ai-blog-notes)\n\n> **\"은퇴 후 인생 2막, AI를 파트너 삼아 안정적인 노후 수입을 만드는 블로그 운영 지침서 & 메모\"**\n\n---\n\n## 💡 프로젝트 비전 (Vision)\n\n은퇴 후 가장 가치 있는 자산은 **30~40년 동안 축적된 삶의 지혜와 경험**입니다.  \n`ai-blog-notes`는 AI(Gemini, ChatGPT, Claude)를 유능한 비서로 활용하여, 글쓰기의 물리적 부담(자료 조사, 뼈대 잡기, 초안 작성)을 80% 줄이고, 나만의 스토리와 감성을 더해 **월 100만~300만 원 이상의 안정적인 노후 현금 흐름**을 만드는 실전 지침서이자 작업 공간입니다.\n\n---\n\n## 🎯 4대 핵심 축\n\n| 축 | 핵심 내용 | 목표 |\n| :--- | :--- | :--- |\n| **1. 수익화 전략** | 구글 애드센스, 네이버 애드포스트, 제휴마케팅(쿠팡 등), 협찬 | 지속 가능한 노후 부수입 파이프라인 구축 |\n| **2. 고단가 니치 주제** | 연금·절세, 시니어 건강, 재취업·창업, 은퇴 일상/취미(골프 등), 여행 | 단가가 높고 독자 충성도가 높은 주제 선점 |\n| **3. AI + 휴먼 터치** | AI의 초안 작성 + 필자의 진솔한 경험담/감성 결합 | 검색엔진 최적화(SEO) 및 감동을 주는 글 완성 |\n| **4. 시스템화 & 템플릿** | 클릭을 부르는 제목, 도입부 후킹, 본문 템플릿, 프롬프트 저장소 | 1시간 만에 고품질 포스팅 1편 발행 |\n\n---\n\n## 📂 프로젝트 디렉토리 구조\n\n```\nai-blog-notes/\n├── index.html                  # [포털] 멀티 블로그 통합 허브 (네이버, 티스토리, 워드프레스)\n├── README.md                   # 프로젝트 소개 및 로드맵\n├── HELP                        # 작업 요청 및 업데이트 히스토리\n├── AGENTS.md / GEMINI.md       # AI 에이전트 자율 권한 설정\n├── docs/                       # [지침서] 블로그 운영 가이드 & 뷰어\n│   ├── index.html              # 브라우저 전용 마크다운 가이드 뷰어\n│   ├── 01-strategy/            # [전략] 수익화 모델, 시니어 고단가 주제, 퍼스널 브랜딩\n│   ├── 02-platforms/           # [플랫폼] 네이버 vs 티스토리 vs 워드프레스 비교 및 선택\n│   ├── 03-ai-workflows/        # [워크플로우] 키워드 발굴부터 휴먼터치 퇴고까지 6단계\n│   ├── 04-prompts/             # [프롬프트] 제목, 도입부, 본문, 경험 결합 실전 프롬프트 모음\n│   ├── 05-templates/           # [템플릿] 정보형, 리뷰형, 비교분석형, 일상에세이형 글쓰기 틀\n│   └── notes/                  # [메모] 블로그 아이디어 및 영감 기록장\n├── workflow/                   # [워크플로우] 네이버·티스토리 공통 8단계 작업 절차\n│   ├── daily-workflow.md       # 매일 수행할 작업 순서(Step 1~8)와 30분 시간 배분\n│   ├── topic-selection.md      # 네이버·티 daily-naver-blog.sh     # caffeinate 절전 차단 & 실행 래퍼 스크립트\n│   ├── install-launchd.sh      # launchd LaunchAgent 적재 (매일 00:00 실행)\n│   ├── uninstall-launchd.sh    # launchd 등록 해제 스크립트\n│   └── launchd/                # com.user.daily-naver-blog.plist\n└── tools/                      # [도구] 보조 분석 및 자동화 스크립트\n    ├── daily_naver_batch.py    # 네이버 실시간 트렌드 수집 & 일별 포스팅 자동 생성 배치\n    ├── daily_tistory_batch.py  # 티스토리 Google Trends 상승 검색어 평가 & 7단계 글 생성 배치\n    ├── daily_wordpress_batch.py# 워드프레스 코너스톤 SEO(Slug/Meta/FAQ) 글 생성 배치\n    ├── generate_html.py        # docs/index.html 가이드 뷰어 갱신 빌더\n    └── blog_helper.py          # 글자수, 키워드 밀도, SEO 구조 분석 CLI 도구\n```\n\n---\n\n## 🚀 AI 파트너와 함께 일하는 방법 (AI Native Workflow)\n\n1. **포털 열람 (`open index.html`)**:\n   - 브라우저에서 통합 포털을 열어 오늘의 네이버 블로그 포스팅과 실시간 검색어 Top 10을 확인합니다.\n2. **원클릭 스마트에디터 복사**:\n   - `blog/naver/posts/YYYYMM/YYYY-MM-DD.html`에서 **[🟢 네이버 스마트에디터 서식 복사]** 버튼을 눌러 `**` 기호 없이 서식 그대로 네이버 블로그에 붙여넣습니다.\n3. **휴먼 터치 퇴고**:\n   - AI가 작성한 초안에 나의 실제 경험담, 느낀 점, 사진을 1~2장 추가하여 나만의 특별한 글을 완성합니다.\n4. **품질 점검**:\n   - `python tools/blog_helper.py draft.md`로 글자수, 소제목 구조, 키워드 빈도를 확인하고 최종 발행합니다.\n\nFocus Keyphrase: 퇴직 후 건강보험료 계산\nSlug: /retirement-health-insurance-calculation-guide\nMeta Description: 퇴직 후 건강보험료 계산 기준과 절감 방법 총정리. \n직장가입자 피부양자 자격 요건(연 소득 2,000만 원·재산 과표 5.4억 이하), \n임의계속가입 신청 기한(2개월 이내), 지역가입자 모의계산 비교표를 확인하세요."}, "monetization-models": {"metadata": {"id": "monetization-models", "category": "01. 수익화 전략", "category_icon": "💰", "title": "수익화 모델 4단계 총정리", "file_path": "docs/01-strategy/01-monetization-models.md", "url_path": "01-strategy/01-monetization-models.md", "desc": "애드센스, 제휴마케팅, 협찬, 지식창업 단계별 디지털 연금 파이프라인"}, "content": "# 💰 은퇴 후 블로그 수익화 모델 총정리\n\n은퇴 후 블로그는 단순한 취미를 넘어, **시간과 공간의 제약 없이 매월 안정적인 현금 흐름을 만들어주는 디지털 자산**이 될 수 있습니다.  \n하나의 방식에만 의존하지 않고, 여러 수익원을 다각화(파이프라인 구축)하는 것이 핵심입니다.\n\n---\n\n## 1. 광고 수익 (CPC / CPM)\n\n### ① 네이버 애드포스트 (Naver AdPost)\n- **적합 대상**: 네이버 블로그 운영자\n- **진입 장벽**: 낮음 (개설 90일 이상, 일 방문자 100명 내외, 포스팅 30~50개 이상이면 승인)\n- **수익성**: 클릭당 단가가 상대적으로 낮음 (월 5만~30만 원 선에서 시작). 하지만 방문자 수가 많아지면 꾸준한 용돈 파이프라인 형성.\n- **최적 주제**: 일상, 맛집, 여행, 시니어 건강, IT 제품 사용기\n\n### ② 구글 애드센스 (Google AdSense)\n- **적합 대상**: 티스토리(Tistory) 또는 워드프레스(WordPress) 운영자\n- **진입 장벽**: 중간 (일명 '애드고시', 양질의 정보성 글 15~20편 이상 필요)\n- **수익성**: **달러($)로 지급되며 클릭당 단가(CPC)가 네이버보다 월등히 높음**. 금융, 보험, 연금, 대출, 건강 키워드의 경우 클릭 한 번에 수천 원~1만 원 이상 발생 가능.\n- **목표 수익**: 일 방문자 1,000~2,000명 기준 월 30만~100만 원 이상 달러 파이프라인.\n\n---\n\n## 2. 제휴 마케팅 (CPA / CPS - 성과형 커미션)\n\n### ① 쿠팡 파트너스 (Coupang Partners)\n- **원리**: 블로그 글에 상품 링크를 남기고, 독자가 링크를 클릭해 24시간 내 구매하면 구매액의 **3% 커미션** 수령.\n- **장점**: 링크를 클릭한 뒤 다른 물건(예: 세제, 가전제품)을 사도 수익 인정.\n- **은퇴자 추천 전략**: \n  - 내가 직접 내돈내산한 생활용품, 건강기능식품, 골프 용품, 등산 장비 등의 솔직한 사용 후기 작성 후 구매 링크 삽입.\n\n### ② 기타 제휴 플랫폼 (텐핑, 디비디비딥, 알리익스프레스)\n- 금융/보험 상담 신청 시 건당 1만~3만 원 지급.\n- 알리익스프레스 어필리에이트 (해외 가성비 생활/취미 용품 추천 시 커미션).\n\n---\n\n## 3. 원고료 및 제품 협찬 (스폰서드 콘텐츠)\n\n- **원리**: 기업이나 소상공인으로부터 제품을 무료로 제공받거나, 포스팅 1건당 원고료(건당 5만~30만 원)를 받고 리뷰 작성.\n- **활동 채널**: 네이버 블로그가 가장 유리 (레뷰, 리뷰노트, 디너의여왕 등 체험단 플랫폼 활용).\n- **은퇴자 혜택**: \n  - 생활비 절감 (건강식품, 레스토랑 외식권, 골프장 라운드 협찬, 여행 숙박권 등).\n  - 블로그 지수가 올라가면 직접 이메일/쪽지로 유료 원고 작성 의뢰 유입.\n\n---\n\n## 4. 2차 지식 비즈니스 (N잡 확장)\n\n- **전자책(PDF) 출판**: 30년 직장 생활 노하우, 은퇴 준비 꿀팁, 절세 가이드 등을 크몽, 탈잉에 전자책으로 판매 (권당 1만~3만 원, 순수익 80%).\n- **브런치 작가 & 종이책 출간**: 브런치스토리에 연재하여 출판사 러브콜을 통한 정식 종이책 출간 및 인세 수입.\n- **강의 및 자문**: 은퇴 설계, 시니어 재테크, 취미 특강 강사로 확장.\n\n---\n\n## 📊 추천 수익화 로드맵 (월 100만 원 달성 플랜)\n\n```\n[1~3개월차] 기반 다지기\n - 플랫폼 개설 (네이버 + 티스토리/워드프레스 중 택 1~2)\n - 주 3~4회 양질의 정보성 글 발행\n - 애드포스트 / 애드센스 승인 완료\n\n[4~6개월차] 제휴마케팅 결합\n - 방문자 일 500~1,000명 달성\n - 주 1회 '내돈내산 솔직 리뷰' + 쿠팡 파트너스 링크 삽입\n - 예상 수익: 광고(10~20만 원) + 제휴(10~20만 원) = 월 20~40만 원\n\n[7~12개월차] 협찬 및 고단가 키워드 공략\n - 방문자 일 2,000명+ 및 특정 분야(건강/골프/연금) 전문 블로그 안착\n - 기업 원고료 협찬 유치 (월 2~4건 = 20~50만 원)\n - 애드센스 고단가 금융/건강 키워드 공략 (월 40~60만 원)\n - 목표 달성: 월 100만~150만 원의 안정적 부수입 달성!\n```\n"}, "senior-niche-topics": {"metadata": {"id": "senior-niche-topics", "category": "01. 수익화 전략", "category_icon": "💰", "title": "은퇴/시니어 고단가 니치 주제 30선", "file_path": "docs/01-strategy/02-senior-niche-topics.md", "url_path": "01-strategy/02-senior-niche-topics.md", "desc": "연금/절세, 건강/액티브시니어, 재취업, 라이프스타일 고단가 키워드"}, "content": "# 🎯 은퇴/시니어 특화 고단가 니치 주제 30선\n\n블로그의 성패는 **\"누가 읽을 것인가(타겟)\"**와 **\"광고 단가가 얼마나 높은가(CPC)\"**에 달려 있습니다.  \n은퇴자 블로거는 젊은 세대가 흉내 낼 수 없는 **'진솔한 나이듦의 경험'**과 **'실질적인 관심사'**를 다룰 때 가장 강력한 영향력과 높은 광고 단가를 얻습니다.\n\n---\n\n## 1. 돈 & 절세 & 연금 (광고 단가 ★★★★★ / 최고 수익)\n금융/보험 키워드는 구글 애드센스 클릭 1번에 수천 원~1만 원 이상 나오는 최고 단가 영역입니다.\n\n1. **국민연금 수령액 늘리는 실전 팁** (임의계속가입, 연기연금 장단점 분석)\n2. **퇴직연금(DC형/IRP) 안전 운용법** (원리금보장형 vs TDF 펀드 실투자 후기)\n3. **은퇴자 건강보험료 줄이는 법** (지역가입자 전환 시 재산 축소, 피부양자 자격 유지 팁)\n4. **주택연금 가입 전 반드시 알아야 할 5가지** (집값 상승기 vs 하락기 비교)\n5. **60대 이후 기초연금 수급 자격 및 모의 계산법**\n6. **상속세와 증여세 기본 절세 가이드** (자녀에게 부담 없이 증여하는 법)\n\n---\n\n## 2. 건강 & 웰빙 & 질환 예방 (광고 단가 ★★★★☆ / 꾸준한 트래픽)\n시니어 세대의 최대 관심사로, 검색량이 매우 방대하며 건강식품 제휴마케팅과 직결됩니다.\n\n7. **5060 혈당 스파이크 잡는 식단 루틴** (실제 연속혈당측정기 사용 경험기)\n8. **오십견 vs 회전근개 파열 자가진단 및 통증 완화 스트레칭**\n9. **시니어 근감소증 예방을 위한 단백질 보충제 솔직 비교**\n10. **무릎 관절염 초기 관리법과 효과 본 영양제 성분 분석**\n11. **숙면을 취하지 못하는 불면증 극복 루틴** (수면 환경, 베개 선택기)\n12. **은퇴 후 찾아오는 마음의 감기(우울증/공허함) 다스리기**\n\n---\n\n## 3. 시니어 스포츠 & 취미 (광고 단가 ★★★★☆ / 협찬 & 장비 리뷰)\n장비 구매력이 높고 동호회 활동이 활발한 영역입니다.\n\n13. **50대 이후 부상 없는 골프 스윙 비결** (관절에 무리 안 가는 스윙 메커니즘)\n14. **수도권 파3 & 숏게임 연습장 솔직 비교 가이드** (가성비, 접근성, 잔디 상태)\n15. **시니어 골퍼를 위한 경량 샤프트 및 고반발 드라이버 추천 가이드**\n16. **은퇴 후 시작하는 파크골프 입문 가이드** (비용, 구장 찾는 법, 매너)\n17. **무릎 부담 없는 시니어 등산/트레킹 명코스 BEST 5**\n18. **스마트폰 하나로 시작하는 디지털 사진/영상 촬영 취미**\n\n---\n\n## 4. 제2의 커리어 & 재취업 & 사회활동 (광고 단가 ★★★★☆)\n퇴직 후 재취업이나 창업, 소일거리에 대한 현실적인 정보 수요가 매우 큽니다.\n\n19. **신중년 재취업 지원제도 및 정부 지원 일자리 총정리**\n20. **은퇴 후 도전하기 좋은 유망 국가자격증 5선** (손해평가사, 조경기능사 등)\n21. **소자본 무인 매장 창업 vs 프랜차이즈 창업 현실 비교**\n22. **사회복지사 2급 자격증 취득 과정과 현실적인 활용처**\n23. **시니어 강사/멘토로 활동하는 방법**\n\n---\n\n## 5. 은퇴 일상 & 주거 & 힐링 (친밀도 ★★★★★ / 네이버 인기)\n독자들과 공감대를 형성하고 이웃을 늘리는 따뜻한 스토리텔링 영역입니다.\n\n24. **은퇴 첫 1년, 생활비 얼마 들었을까? 실제 가계부 공개**\n25. **귀농·귀촌 1년 살아보고 느낀 장단점과 현실적인 주의점**\n26. **부부 둘이 살기 딱 좋은 20평대 다운사이징 인테리어 노하우**\n27. **남편의 삼식이 탈출기: 은퇴 남자의 초간단 집밥 요리 레시피**\n28. **혼자 또는 부부가 떠나는 슬로우 국내 여행지 추천** (ktx 연계, 온천 여행)\n29. **은퇴 후 친구 관계 정리와 새로운 관계 맺기**\n30. **AI(ChatGPT/Gemini)로 일상에서 스마트하게 살아남기** (시니어 AI 꿀팁)\n\n---\n\n## 💡 황금 주제 선정 3대 원칙\n1. **나의 실제 관심사인가?** (억지로 쓰면 1달 만에 지칩니다. 내가 평소 궁금한 것을 파고드세요.)\n2. **독자의 고통(Pain Point)을 해결해 주는가?** (단순 일기보다 \"어떻게 해결했는지\" 정보가 들어있어야 합니다.)\n3. **검색량이 있는 키워드인가?** (네이버 데이터랩, 블랙키위 등으로 월간 검색수를 확인하세요.)\n"}, "platform-comparison": {"metadata": {"id": "platform-comparison", "category": "02. 플랫폼 비교", "category_icon": "🌐", "title": "블로그 플랫폼 완벽 비교 & 추천", "file_path": "docs/02-platforms/01-platform-comparison.md", "url_path": "02-platforms/01-platform-comparison.md", "desc": "티스토리 vs 워드프레스 vs 네이버 블로그 장단점 및 병행 전략"}, "content": "# 🌐 블로그 플랫폼 완벽 비교 및 추천 전략\n\n어떤 플랫폼을 선택하느냐에 따라 **수익 모델(원화 vs 달러)**과 **글쓰기 방식**이 완전히 달라집니다.  \n은퇴자에게는 무리한 기술적 장벽 없이, 자신의 성향과 목표에 맞는 플랫폼을 고르는 것이 중요합니다.\n\n---\n\n## 1. 4대 블로그 플랫폼 비교 분석\n\n| 비교 항목 | 🟢 네이버 블로그 | 🟠 티스토리 (Tistory) | 🔵 워드프레스 (WordPress) | 🟣 브런치스토리 (Brunch) |\n| :--- | :--- | :--- | :--- | :--- |\n| **주요 독자층** | 국내 검색자, 이웃 소통, 40~60대 친화적 | 구글/다음 검색 유입자 | 구글 검색 유입자, 글로벌 | 감성 에세이, 출판 기획자, 전문직 |\n| **주요 수익원** | 애드포스트, 협찬, 체험단, 제휴마케팅 | **구글 애드센스 (달러)**, 제휴마케팅 | **구글 애드센스 (달러)**, 제휴마케팅 | 출판 연계(인세), 강연, 구독료 |\n| **수익성** | 방문자 대비 광고단가 낮음 / 협찬수익 높음 | 광고단가(CPC) 높음 | 광고단가(CPC) 최고 / 완전 독립 | 직접 광고 수익은 낮음 |\n| **개설 난이도** | ★☆☆☆☆ (네이버 아이디로 즉시) | ★★☆☆☆ (카카오 계정으로 간편) | ★★★★☆ (도메인/호스팅 설정 필요) | ★★☆☆☆ (작가 심사 통과 필요) |\n| **운영 유지비** | 0원 (완전 무료) | 0원 (완전 무료) | 월 5천~2만 원 (서버비+도메인) | 0원 (완전 무료) |\n| **저품질 위험** | 키워드 남발 시 검색 누락 가능 | 자체 광고 도입 후 정책 리스크 존재 | 서버 소유권 100% (플랫폼 리스크 제로) | 상업적 광고 글 게재 불가 |\n\n---\n\n## 2. 플랫폼별 심층 가이드\n\n### 🟢 1) 네이버 블로그: \"가장 쉽고 빠르게 독자와 소통하고 협찬받는 곳\"\n- **장점**:\n  - 한국인 80%가 검색하는 플랫폼으로 초반 방문자 유입이 가장 빠름.\n  - 이웃 간의 댓글, 공감 등 따뜻한 소통으로 은퇴 후 활력과 유대감 형성.\n  - 맛집, 건강식품, 골프용품, 생활용품 등 무료 제품 협찬 및 체험단 당첨이 매우 쉬움.\n- **단점**: 자체 광고(애드포스트) 단가가 낮아 방문자 수가 아주 많지 않으면 광고 수익 자체는 월 5만~20만 원 수준.\n- **추천 대상**: 친근한 일상, 취미(골프/여행), 생활 정보, 솔직 리뷰를 쓰고 싶은 분.\n\n### 🟠 2) 티스토리: \"무료로 시작하는 구글 애드센스 달러 파이프라인\"\n- **장점**:\n  - 서버 비용 없이 카카오 계정으로 무료 개설 가능.\n  - 구글 검색 엔진(SEO)에 잘 노출되며, 구글 애드센스 승인을 받아 **달러($) 수익** 창출.\n- **단점**: 최근 카카오 자체 광고 정책 도입 등으로 이전보다 수익이 다소 분산됨.\n- **추천 대상**: 금융, 연금, IT, 정책 등 정보성 글을 체계적으로 정리하여 달러 수익을 모으고 싶은 분.\n\n### 🔵 3) 워드프레스: \"평생 나만의 디지털 건물(완전 독립 자산)\"\n- **장점**:\n  - 특정 기업(카카오, 네이버)에 종속되지 않고 영구적으로 보존되는 내 소유의 사이트.\n  - 구글 검색 알고리즘에 가장 최적화되어 장기적으로 가장 높은 애드센스 수익 달성.\n- **단점**: 도메인 구매(연 1.5만 원), 클라우드웨이즈/카페24 등 호스팅 비용(월 1~2만 원) 발생 및 초기 세팅 난이도 있음.\n- **추천 대상**: 6개월~1년 이상 진지하게 디지털 파이프라인을 구축할 의지가 있는 분.\n\n### 🟣 4) 브런치스토리: \"나의 인생 스토리를 책으로 만드는 공간\"\n- **장점**:\n  - 광고가 없어 글에만 집중할 수 있는 깔끔한 UI.\n  - 출판사 에디터들이 매일 모니터링하므로 정식 종이책 출간 기회가 가장 높음.\n- **단점**: 상업적 링크나 배너 광고 불가.\n- **추천 대상**: 30년 인생 이야기, 은퇴 소회, 전문 분야 에세이를 기록하고 책을 내고 싶은 분.\n\n---\n\n## 🏆 은퇴자 추천 투트랙(Dual Channel) 전략\n\n가장 권장하는 전략은 **\"네이버 블로그 + 티스토리(or 워드프레스)\"의 2채널 조합**입니다.\n\n```\n[채널 A] 네이버 블로그 (국내 소통 & 협찬형)\n - 일상, 골프 취미, 여행기, 맛집, 내돈내산 제품 리뷰\n - 목적: 빠른 방문자 확보, 무료 협찬/체험단, 이웃 소통의 즐거움\n\n[채널 B] 티스토리 or 워드프레스 (구글 애드센스 달러형)\n - 연금 제도, 절세 상식, 시니어 복지 혜택, 의학/건강 전문 정보\n - 목적: 구글 검색 노출, 클릭당 1,000원~5,000원짜리 고단가 달러 광고 수익\n```\n> 💡 **Tip**: AI를 활용하면 같은 주제의 글이라도 톤앤매너만 바꾸어 (네이버용 친근한 구어체 ↔ 티스토리용 구조화된 정보형) 10분 만에 2개 플랫폼용 글을 동시에 완성할 수 있습니다!\n"}, "tistory-guide": {"metadata": {"id": "tistory-guide", "category": "02. 플랫폼 비교", "category_icon": "🟠", "title": "티스토리 개설·운영 & Google Trends 실전 가이드", "file_path": "docs/02-platforms/02-tistory-guide.md", "url_path": "02-platforms/02-tistory-guide.md", "desc": "티스토리 개설부터 서치콘솔, 애드센스 준비, Google Trends 상승 검색어 100점 평가 및 7단계 템플릿"}, "content": "# 티스토리(Tistory) 블로그 개설·운영 및 Google Trends 주제 선정 완벽 가이드\n\n> **핵심 요약**: 현재 하루 3~5개씩 운영 중인 **네이버 블로그**는 초기 콘텐츠와 국내 실시간 검색/이웃 유입을 쌓고, 새로 시작하는 **티스토리 블로그**는 **Google Trends 상승 검색어 기반의 장기 검색형 정보 콘텐츠**로 **구글 검색 유입(SEO)과 애드센스(AdSense) 수익**을 구축하는 투트랙(Two-Track) 전략으로 운영합니다.\n\n---\n\n## 1. 전체 운영 전략: 네이버 vs 티스토리 역할 분담\n\n| 구분 | 🟢 네이버 블로그 (기존 운영 유지) | 🟠 티스토리 블로그 (신규 확장) |\n| :--- | :--- | :--- |\n| **발행 목표** | 하루 3~5개 작성 유지 | 초기 **하루 1개** 또는 **주 5개** 목표 |\n| **핵심 유입원** | 네이버 스마트블록 검색 및 이웃 소통 유입 | **구글(Google) 검색** 및 다음(Daum) 유입 |\n| **주제 성격** | 실시간 검색어 TOP 10, 국내 생활정보, 사용 경험 | **Google Trends 상승 검색어 → 구체적인 질문·비교·해결법** |\n| **수익 모델** | 네이버 애드포스트, 체험단/협찬, 제휴마케팅 | **구글 애드센스(AdSense)** 달러($) 광고 수익 |\n| **콘텐츠 수명** | 당일 이슈 확산 및 단기 유입 집중 | **몇 주~몇 달 후에도 꾸준히 검색되는 지속형 자산** |\n\n> ⚠️ **중요 운영 원칙 (중복 게시 금지)**  \n> 네이버 글을 그대로 복사해서 티스토리에 반복 게시하는 방식은 권장하지 않습니다. **'주제 조사 한 번, 플랫폼별 글 두 편'** 원칙으로 같은 큰 주제를 다루더라도 제목, 구성, 설명, 독자에게 제공하는 해결 정보를 플랫폼 검색 의도에 맞게 다르게 작성하세요.\n\n---\n\n## 2. 티스토리 블로그 개설 및 초기 필수 설정\n\n### 1단계: 티스토리 접속 및 가입\n- **공식 사이트**: [https://www.tistory.com/](https://www.tistory.com/) (PC 크롬 브라우저 권장)\n- **개설 절차**:\n  1. 티스토리 홈페이지 접속 후 우측 상단 **[시작하기]** 클릭\n  2. 블로그 운영에 사용할 **카카오계정**으로 로그인\n  3. 블로그 이름과 기본 블로그 주소(`xxxxx.tistory.com`) 입력 및 중복 확인 후 개설\n- **주의사항**: `xxxxx.tistory.com` 형태의 기본 주소는 **개설 후 변경할 수 없습니다.** 특정 상품이나 한 가지 좁은 주제에 묶이지 않는 포괄적이고 기억하기 쉬운 영문 주소(예: `smartlifelab`, `pummilife` 등)를 신중히 선택하세요.\n\n### 2단계: 블로그 기본 정보 예시\n- **블로그 이름**: `똑똑한 생활탐구` (또는 `품미인생 정보연구소`)\n- **블로그 소개**: *\"은퇴 준비부터 AI 활용법, 생활 속 제품 비교까지 공식 자료로 직접 확인하고 쉽게 정리하는 실용 정보 블로그입니다.\"*\n\n### 3단계: 개설 직후 필수 관리 설정\n\n| 설정 항목 | 추천 설정 기준 |\n| :--- | :--- |\n| **블로그 제목** | `똑똑한 생활탐구` 또는 선택한 브랜드명 |\n| **블로그 설명** | 어떤 정보를 제공하는지 1~2문장으로 명확히 작성 |\n| **프로필** | 깔끔한 로고 또는 신뢰감을 주는 프로필 이미지 |\n| **스킨** | 기본 제공 스킨 중 모바일 가독성이 좋고 본문 폭이 명확한 반응형 스킨 (복잡한 코딩 불필요) |\n| **카테고리** | 초기에는 5개 내외로 단순하게 구성 (빈 카테고리 최소화) |\n| **댓글·방명록** | 로그인 사용자만 허용 또는 승인 후 공개 등 스팸 관리 설정 |\n| **공개 설정** | 일반 정보 글은 **공개 발행** 기본 설정 |\n\n### 4단계: 추천 카테고리 5개 및 초기 운영 비중\n\n1. **은퇴·연금·생활비 (30%)**: 국민연금, 개인연금, 퇴직 후 건강보험료, 노후 생활비 계산\n2. **AI·IT 활용법 (25%)**: ChatGPT 활용법, AI 코딩/문서 도구, 맥(Mac)/스마트폰 사용법, 업무 자동화\n3. **제품 비교·사용법 (25%)**: 제품 사양·기능 비교, 사용 절차, 구매 전 필수 확인 사항, 수수료/세금 비교\n4. **골프·취미 (10%)**: 골프·파크골프 연습, 장비 선택 기준, 시니어 취미 정보\n5. **반려동물·생활정보 (10%)**: 사료 성분 비교, 반려동물 용품, 일상 생활 문제 해결\n\n### 5단계: 애드센스 심사를 대비한 신뢰 정보 준비\n- **블로그 소개**: 운영 목적과 주요 다루는 주제 명시\n- **문의 방법**: 독자가 운영자에게 연락할 수 있는 이메일 또는 문의 채널 안내\n- **개인정보처리방침**: 분석 도구(GA/서치콘솔) 및 광고(애드센스 쿠키) 처리 안내\n- **빈 카테고리/깨진 링크 점검**: 준비 중인 빈 메뉴나 동작하지 않는 링크 최소화\n\n---\n\n## 3. Google Trends 상승 검색어로 티스토리 주제 선별하기\n\n티스토리는 실시간 검색어 단어 자체를 제목으로 쓰지 않고, **그 검색어 뒤에 숨은 독자의 구체적인 질문(방법·비교·조건·절차)**을 찾아내어 장기 검색 글로 변환합니다.\n\n### 매일 사용하는 주제 발굴 도구 4곳\n1. **Google Trends ([trends.google.com/trends](https://trends.google.com/trends/))**: 한국 지역 최근 7일·30일 관심도 상승 추세 및 관련 검색어 확인\n2. **Google Trends Trending Now ([trends.google.com/trending](https://trends.google.com/trending))**: 신제품 출시, 정책 발표, 경제 지표, IT 서비스 이슈 등 급상승 검색어 포착\n3. **Google Search Console ([search.google.com/search-console](https://search.google.com/search-console/))**: 내 블로그에 실제 노출되지만 클릭이 적거나 추가 설명이 필요한 후속 검색어 발굴\n4. **Google 검색 ([www.google.com](https://www.google.com/))**: 후보 키워드를 직접 검색해 기존 상위 글의 빈틈(오래된 정보, 공식 표 누락, 절차 불친절) 확인\n\n### 실시간/상승 검색어를 티스토리 주제로 바꾸는 변환 공식\n\n| 상승 검색어 유형 | 티스토리 장기 검색 주제로 바꾸는 방법 | 추천도 |\n| :--- | :--- | :---: |\n| **새 스마트폰·IT 서비스 출시** | 모델별 기능·가격·요금제·이전 세대와의 스펙 비교표 및 설정법 | **높음** |\n| **정부 지원금·연금·경제지표 발표** | 지원 대상/제외 조건, 신청 기간·절차, 공식 사이트 조회 및 계산 방법 | **높음** |\n| **특정 IT·맥·앱 서비스 오류** | 오류 발생 원인, 단계별 해결 순서, 공식 고객센터 공지 정리 | **높음** |\n| **생활용품·귀금속·제품 트렌드** | 구매 전 확인 사항, 등급/순도/수수료 비교표, 장단점 정리 | **높음** |\n| **주식·반도체·환율 급등락** | 변동 배경, 공식 지표 확인법, 관련 ETF/계좌 절세 조건 및 유의사항 | **신중 (정보형 전환)** |\n| **인기 드라마·연예·단순 사건** | 단기 이슈성으로 장기 검색 가치가 낮음 (네이버 블로그에서 소화 권장) | **낮음** |\n\n### 티스토리 주제 선정 5대 평가 기준 (100점 만점 루브릭)\n\n매일 수집된 트렌드 후보 중 아래 5가지 항목(각 1~5점, 합산 × 4 = 100점 만점)을 평가하여 **70점 이상**인 주제를 우선 작성합니다.\n\n1. **검색 관심도 상승 (20점)**: Google Trends에서 최근 관심도가 오르고 있는가?\n2. **검색 의도 명확성 (20점)**: 검색자가 원하는 답(방법·비교·조건)을 구체적으로 정의할 수 있는가?\n3. **경쟁 글의 빈틈 (20점)**: 기존 상위 글에 최신 공식 표나 단계별 절차가 부족해 개선 기회가 있는가?\n4. **내가 다룰 수 있는 정도 (20점)**: 나의 경험·지식·공식 기관 자료를 활용해 정확히 검증해 쓸 수 있는가?\n5. **장기 검색 가능성 (20점)**: 당일 유행이 지나도 몇 주~몇 달간 계속 검색될 주제인가?\n\n### 첫 30일 콘텐츠 포트폴리오 배분\n- **50% 지속형 검색 콘텐츠**: 설정 방법, 오류 해결, 제품 비교, 공식 조회 절차 안내\n- **30% 상승 검색어 기반 콘텐츠**: 신제품, 정책 변경, 새로운 AI 기능, 관심도 상승 주제\n- **20% 개인 경험과 전문성 콘텐츠**: 직접 사용한 도구, 실제로 해결한 문제, 상세 비교 분석\n\n---\n\n## 4. 티스토리 표준 글 구성 7단계 템플릿\n\n한 편당 **공백 포함 약 1,500~2,500자** 내외로, 글자 수를 억지로 늘리기보다 **검색한 사람의 질문을 가장 명확하고 구조적으로 해결**하는 데 집중합니다.\n\n1. **도입부**: 독자가 어떤 문제를 해결하려는지 짚어주고, 이 글에서 얻을 수 있는 핵심 정보를 요약합니다.\n2. **핵심 내용 요약 (결론 선제시)**: 가장 중요한 핵심 답변을 상단 박스나 요약본으로 먼저 제시합니다. 준비물이나 필수 조건도 함께 안내합니다.\n3. **단계별 설명**: 공식 사이트 확인 절차나 해결 순서를 `1단계 → 2단계 → 3단계`로 따라 하기 쉽게 설명합니다.\n4. **사례 또는 비교표**: 서로 다른 조건이나 제품/제도에 따라 결과가 어떻게 달라지는지 마크다운 표(Table)로 정리합니다. (**확인되지 않은 숫자는 넣지 않고 가정 조건을 명시**합니다.)\n5. **주의사항 (체크포인트)**: 예외 조건, 연도별 변경될 수 있는 정책, 개인별 조건 차이 등 추가 확인이 필요한 사항을 적습니다.\n6. **결론 (다음 행동 정리)**: 독자가 글을 읽은 직후 바로 실행해야 할 행동을 2~3줄로 명확히 정리합니다.\n7. **참고 자료**: 국민연금공단, 국민건강보험공단, 한국은행, 공식 제조사 등 관련 공식 페이지 링크를 연결합니다.\n\n---\n\n## 5. 복사해서 바로 쓰는 티스토리 AI 작성 프롬프트\n\n```markdown\n# 티스토리 검색형 블로그 글 작성 지침\n\n당신은 정확성과 실용성을 중시하는 블로그 편집자입니다.\n\n## 작성 목표\n독자가 구글 검색을 통해 유입되어 궁금한 문제를 해결할 수 있는 티스토리용 정보 글을 작성합니다.\n\n## 입력 정보\n- 주제: [작성할 주제]\n- 주요 독자: [대상 독자]\n- 검색할 질문: [독자가 해결하려는 문제]\n- 참고 자료: [공식 URL 및 확인된 자료]\n- 직접 확인한 경험: [있으면 입력, 없으면 없음]\n\n## 작성 규칙\n1. 검색 질문에 대한 핵심 답변을 도입부에서 먼저 제시합니다.\n2. 제목은 구체적이고 자연스럽게 작성합니다.\n3. 본문은 소제목(H2/H3)과 단계별 설명으로 구성합니다.\n4. 확인되지 않은 통계, 가격, 정책, 개인 경험을 만들지 않습니다.\n5. 최신 정보가 필요한 내용은 공식 자료를 우선 확인하고, 확인하지 못한 사실은 [확인 필요]라고 표시합니다.\n6. 다른 블로그의 문장을 복사하거나 비슷한 문장을 반복하지 않습니다.\n7. 키워드를 부자연스럽게 반복하지 않습니다.\n8. 실제로 도움이 되는 예시, 비교표, 주의사항을 주제에 맞게 포함합니다.\n9. 출처가 있는 경우 해당 주장 가까이에 출처 링크를 제시합니다.\n10. 의료·금융·세금·법률 관련 주제는 단정적인 조언을 피하고 개인별 차이를 설명합니다.\n\n## 출력 형식\n1. 제목 후보 3개\n2. 최종 추천 제목\n3. 핵심 답변 요약\n4. 완성된 본문 (도입부 → 핵심 요약 → 단계별 설명 → 사례/비교표 → 주의사항 → 결론)\n5. 사실 확인이 필요한 항목\n6. 참고 자료 목록 (공식 사이트 URL)\n7. 발행 전 검토 체크리스트\n```\n\n### 발행 전 필수 3대 팩트체크\n- [ ] 공식 자료와 본문 내 숫자·기준이 정확히 일치하는가?\n- [ ] 제목이 본문에서 실제로 답하는 핵심 질문과 일치하는가?\n- [ ] 직접 해보지 않은 일을 본인의 실제 경험처럼 과장해 표현하지 않았는가?\n\n---\n\n## 6. 구글 검색 노출(Search Console) 및 애드센스 준비\n\n### Google Search Console 등록 및 사이트맵 제출\n1. [Google Search Console](https://search.google.com/search-console/) 접속 및 로그인\n2. **[속성 추가]** → **URL 접두어** 방식에 내 티스토리 주소(`https://내주소.tistory.com/`) 입력\n3. HTML 태그 등 티스토리에서 지원하는 방식으로 소유권 확인 완료 (티스토리 관리 → 플러그인 → 메타태그 등록 또는 스킨 편집 `<head>` 활용)\n4. **[Sitemaps]** 메뉴에서 아래 두 주소를 실제로 열어본 뒤 제출:\n   - 사이트맵: `https://내블로그주소.tistory.com/sitemap.xml`\n   - RSS: `https://내블로그주소.tistory.com/rss`\n\n### Google AdSense 신청 전략 및 주의사항\n- **카카오 애드핏 신규 연동 종료 안내**: 2026년 6월 29일부터 티스토리는 카카오 애드핏 신규 연동 신청을 종료했으므로, **구글 애드센스(Google AdSense)**를 핵심 수익 모델로 준비합니다. (티스토리 서비스 자체 광고가 노출될 수 있음도 감안)\n- **단계별 신청 로드맵**:\n  - **1주 차**: 블로그 개설, 기본 설정, 카테고리 5개 구성, 첫 정보형 글 발행\n  - **2주 차**: 검색 의도가 명확한 문제 해결형 글 꾸준히 누적 (하루 1개 / 주 5개, 하루 30분 투자)\n  - **3~4주 차**: 글 완성도, 카테고리 빈 곳, 깨진 링크, 서치콘솔 색인 상태 점검 후 애드센스 사이트 등록 및 심사 신청\n"}, "wordpress-guide": {"metadata": {"id": "wordpress-guide", "category": "02. 플랫폼 비교", "category_icon": "🔵", "title": "워드프레스(WP) 구축·구글 SEO 및 수익화 가이드", "file_path": "docs/02-platforms/03-wordpress-guide.md", "url_path": "02-platforms/03-wordpress-guide.md", "desc": "워드프레스 영문 슬러그, Rank Math SEO, 구텐베르크 8단계 코너스톤 템플릿 및 FAQ 스키마 전략"}, "content": "# 워드프레스(WordPress) 구축 · 구글 SEO 최적화 및 장기 수익화 가이드\n\n> **핵심 요약**: **네이버 블로그**(실시간 국내 이슈·스마트블록 유입), **티스토리 블로그**(Google Trends 상승 검색어 기반 단기·중기 질문 해결)에 이어, **워드프레스(WordPress)**는 포털 정책의 제약이 없는 **100% 나만의 독립 디지털 부동산**으로서 **장기 코너스톤(Cornerstone) 정보 콘텐츠, 구글 글로벌 SEO(Rank Math / Yoast), 애드센스 고단가 광고 및 전자책·지식창업 확장**을 담당합니다.\n\n---\n\n## 1. 3대 블로그 플랫폼 역할 분담 (네이버 · 티스토리 · 워드프레스)\n\n- **내 워드프레스 사이트**: [https://smartlife70.wordpress.com/](https://smartlife70.wordpress.com/)\n- **워드프레스 관리자 대시보드 (wp-admin)**: [https://smartlife70.wordpress.com/wp-admin/index.php](https://smartlife70.wordpress.com/wp-admin/index.php)\n- **워드프레스 새 글 작성 화면**: [https://smartlife70.wordpress.com/wp-admin/post-new.php](https://smartlife70.wordpress.com/wp-admin/post-new.php)\n\n| 구분 | 🟢 네이버 블로그 (`품미인생`) | 🟠 티스토리 (`똑똑한 생활탐구`) | 🔵 워드프레스 (`smartlife70`) |\n| :--- | :--- | :--- | :--- |\n| **핵심 역할** | 실시간 트렌드 대응 & 이웃 소통 | Google Trends 상승 검색어 질문 해결 | **영구적 검색 자산(Cornerstone) & 독립 자산화** |\n| **발행 목표** | 하루 3~5편 (실시간 Top 10 연계) | 하루 1편 / 주 5편 (상승 검색어) | **주 2~3편 또는 하루 1편 (심층 가이드북형)** |\n| **주요 유입원** | 네이버 스마트블록 · VIEW | 구글(Google) & 다음(Daum) | **구글(Google) 글로벌/국내 자연 검색 (SEO)** |\n| **수익 모델** | 애드포스트, 협찬, 제휴마케팅 | 구글 애드센스(AdSense) | **구글 애드센스(자체 광고 100%) + 제휴 + PDF 전자책** |\n| **소유권/제약** | 포털 정책 종속 | 카카오 플랫폼 정책 종속 (자체 광고 노출) | **100% 본인 소유 (플랫폼 자체 광고 없음)** |\n\n---\n\n## 2. 워드프레스 초기 필수 설정 및 SEO 플러그인 구성\n\n### 1단계: 도메인·호스팅 및 기본 환경\n- **권장 테마**: 가볍고 코어 웹 바이탈(Core Web Vitals) 점수가 높은 **GeneratePress**, **Astra**, 또는 **Kadence** 테마\n- **고유주소(Permalinks) 설정**: `설정 → 고유주소`에서 **`글 이름 (Post name)`** 선택 후, 개별 글 발행 시 **짧고 명확한 영문 하이픈 슬러그(Slug)** 입력 (예: `/retirement-health-insurance-calculation`)\n\n### 2단계: 필수 플러그인 최소 구성 (속도 저하 방지)\n1. **SEO 플러그인**: **Rank Math SEO** 또는 **Yoast SEO** (메타 설명, Focus Keyphrase, XML 사이트맵, FAQ 스키마 자동 생성)\n2. **목차 플러그인**: **Easy Table of Contents** 또는 구텐베르크 기본 목차 블록 (H2/H3 자동 목차 생성으로 구글 사이트링크 유도)\n3. **캐시·속도 최적화**: **WP Super Cache** 또는 호스팅 기본 캐시 + 이미지 **WebP** 포맷 사용\n\n### 3단계: 워드프레스 5대 필러(Pillar) 카테고리\n1. **Retirement & Pension (은퇴·연금·건보료 마스터 가이드)**\n2. **Tax & Asset Management (연금저축·IRP·절세·안전자산 비교)**\n3. **AI & Tech Guide (ChatGPT·Mac·GitHub·Vercel·자동화 매뉴얼)**\n4. **Senior Health & Benefits (건강검진·임플란트·정부지원금 조건)**\n5. **Active Lifestyle & Gear (파크골프·트레킹·생활가전 스펙 비교)**\n\n---\n\n## 3. 워드프레스 코너스톤(Cornerstone) 글 구성 8단계 표준 템플릿\n\n워드프레스 글은 구텐베르크(Gutenberg) 블록 에디터와 Rank Math SEO 점수 80점 이상 달성을 목표로 아래 8단계 구조로 작성합니다.\n\n1. **SEO 메타데이터 박스**:\n   - **Focus Keyphrase (핵심 키워드)**\n   - **SEO Title (검색 결과 제목, 60자 이내)**\n   - **URL Slug (영문 퍼머링크 슬러그)**\n   - **Meta Description (검색 요약문, 150~160자 이내)**\n2. **핵심 요약 콜아웃 박스 (Key Takeaways)**: 글 상단에서 결론과 핵심 수치를 3줄로 먼저 제시하여 체류 시간을 확보합니다.\n3. **도입부 (Problem & Search Intent)**: 독자가 겪는 문제와 이 가이드에서 해결해 줄 범위를 명확히 정의합니다.\n4. **단계별 실행 절차 (Step-by-Step Guide, H2/H3)**: 공식 사이트 화면 경로와 해결 순서를 단계별로 상세히 안내합니다.\n5. **조건별 상세 비교표 (Comparison Table)**: 구글 추천 스니펫(Featured Snippet) 노출을 위해 마크다운/구텐베르크 표 블록으로 비교 데이터를 제공합니다.\n6. **예외 조건 및 주의사항 (Caveats & Checkpoints)**: 연도별 정책 변경 가능성, 개인별 조건 차이, 불이익 방지 팁을 정리합니다.\n7. **자주 묻는 질문 (FAQ Schema 블록, 3문 3답)**: 구글 검색 결과 하단에 아코디언 형태로 노출되는 FAQ 세트를 포함합니다.\n8. **공식 참고 자료 (Authoritative Outbound Links)**: 공단, 정부 부처, 제조사 공식 문서 링크를 연결해 E-E-A-T 신뢰도를 완성합니다.\n"}, "six-step-pipeline": {"metadata": {"id": "six-step-pipeline", "category": "03. AI 워크플로우", "category_icon": "⚙️", "title": "AI 활용 블로그 작성 6단계 파이프라인", "file_path": "docs/03-ai-workflows/01-six-step-pipeline.md", "url_path": "03-ai-workflows/01-six-step-pipeline.md", "desc": "기획부터 SEO 점검까지 1시간 완성 표준 AI 글쓰기 프로세스"}, "content": "# ⚙️ AI 활용 블로그 작성 6단계 표준 워크플로우\n\n과거에는 글 하나를 쓰려면 자료 조사부터 타이핑, 교정까지 3~4시간이 걸렸습니다.  \nAI(Gemini, ChatGPT, Claude)를 비서로 활용하면 **1시간 이내에 완성도 높은 고품질 포스팅 1편을 제작**할 수 있습니다.\n\n---\n\n## 🔄 6단계 프로세스 한눈에 보기\n\n```mermaid\nflowchart LR\n    A[\"1. 키워드 발굴<br>(수요 조사)\"] --> B[\"2. 아웃라인 기획<br>(목차 구성)\"]\n    B --> C[\"3. AI 초안 생성<br>(섹션별 작성)\"]\n    C --> D[\"4. 휴먼 터치 결합<br>(경험/감성 추가)\"]\n    D --> E[\"5. SEO 최적화<br>(제목/헤더/태그)\"]\n    E --> F[\"6. 최종 발행 & 성과 점검\"]\n```\n\n---\n\n## 단계별 세부 실천 가이드\n\n### 1단계: 황금 키워드 발굴 (수요 조사)\n- **목표**: 사람들이 실제로 많이 검색하지만, 경쟁 블로그가 너무 세지 않은 '빈틈 키워드' 찾기.\n- **활용 도구**: 네이버 데이터랩, 블랙키위(BlackKiwi), 구글 트렌드, 키워드마스터.\n- **AI 활용 팁**:\n  - `프롬프트`: *\"50~60대 은퇴자가 '국민연금'과 관련해 네이버나 구글에 가장 자주 검색하는 질문 키워드 10가지를 검색 의도와 함께 추천해 줘.\"*\n\n### 2단계: 아웃라인(목차) 기획\n- **목표**: 독자가 글을 읽다가 이탈하지 않고 끝까지 스크롤하게 만드는 탄탄한 뼈대 설계.\n- **구조 원칙 (도입 - 본론 - 결론)**:\n  - **도입부**: 독자의 고민 공감 + 이 글을 읽으면 얻게 되는 확실한 혜택 제시.\n  - **본론 (소제목 3~4개)**: 핵심 원리 → 구체적 신청 방법/주의점 → 실제 사례/수치 비교.\n  - **결론 & CTA**: 3줄 요약 + 행동 유도(댓글, 공감, 공유).\n- **AI 활용 팁**:\n  - `프롬프트`: *\"[키워드]를 주제로 블로그 글을 쓰려고 해. 검색 상위 노출에 유리하고 체류 시간을 극대화할 수 있는 H2, H3 소제목 목차를 짜줘.\"*\n\n### 3단계: AI 초안 생성 (섹션별 쪼개어 작성하기)\n- **주의사항**: 한 번에 \"글 전체를 써줘\"라고 하면 내용이 얕아지고 상투적인 문장이 나옵니다.  \n  **소제목별로 나누어 구체적인 데이터를 요청**해야 깊이 있는 글이 나옵니다.\n- **AI 활용 팁**:\n  - `프롬프트`: *\"소제목 1번인 '[소제목 내용]'에 대해 작성해 줘. 은퇴자가 쉽게 이해할 수 있도록 실제 숫자 예시와 표(테이블)를 포함해 줘.\"*\n\n### 4단계: 휴먼 터치 결합 (AI 냄새 제거 & 경험담 삽입)\n- **가장 중요한 단계!** AI가 쓴 글에 나의 생명력을 불어넣는 작업입니다.\n- **체크 포인트**:\n  1. **내 경험 한 줄 넣기**: *\"제가 작년에 직접 국민연금공단에 전화해서 물어봤더니...\"*\n  2. **상투적 AI 말투 삭제**:\n     - ❌ \"현대 사회에서 ~는 필수적입니다.\"\n     - ❌ \"~에 대해 깊이 있게 알아보겠습니다.\"\n     - ❌ \"결론적으로 말씀드리면...\"\n     - ⭕ \"저도 처음엔 참 막막했는데요, 딱 3가지만 알면 쉽더라고요.\"\n  3. **직접 찍은 사진 또는 인증 캡처 삽입**: 구글과 네이버 모두 직접 촬영한 원본 이미지를 가장 높게 평가합니다.\n\n### 5단계: SEO 및 가독성 최적화\n- **제목 작성**: 핵심 키워드를 앞쪽에 배치하고, 숫자와 호기심을 자극하는 문구 결합.\n  - (예: `국민연금 수령액 늘리기` ❌ → `국민연금 매달 30만원 더 받는 법: 제가 직접 신청해 본 후기` ⭕)\n- **소제목 태그**: 마크다운에서는 `## (H2)`, `### (H3)`, 블로그 에디터에서는 '소제목' 서식 적용.\n- **키워드 반복**: 본문 전체에 핵심 키워드가 4~6회 자연스럽게 녹아들도록 점검.\n\n### 6단계: 최종 발행 & 성과 점검\n- **발행 후 24시간 뒤 점검**: 네이버/구글 검색창에 제목을 검색하여 정상 노출되는지 확인.\n- **인기 글 재가공**: 유입이 많은 효자 글은 3~6개월마다 최신 정보로 업데이트하여 1등 순위 유지.\n"}, "daily-workflow": {"metadata": {"id": "daily-workflow", "category": "03. AI 워크플로우", "category_icon": "⚙️", "title": "일일 통합 블로그 워크플로우 (daily-workflow)", "file_path": "workflow/daily-workflow.md", "url_path": "../workflow/daily-workflow.md", "desc": "네이버·티스토리 주제 수집부터 팩트체크·발행·성과 기록까지 8단계 표준 절차"}, "content": "# Daily Blog Writing Workflow (네이버 · 티스토리 통합 일일 워크플로우)\n\n## 1. 목적\n\nAI를 활용하여 **네이버 블로그**와 **티스토리** 콘텐츠를 효율적으로 기획·작성·검증·발행한다.\n\n- **네이버 블로그**: 실시간 이슈와 국내 독자의 관심 검색어 중심 (하루 3~5편, 스마트블록 및 이웃 소통 유입)\n- **티스토리**: 구체적인 검색 질문, 문제 해결, 장기 검색 유입 중심 (하루 1편 / 주 5편, 구글 검색 SEO 및 애드센스 수익)\n- **공통 원칙**: 정확성, 독창성, 출처 검증, 지속 가능한 운영 (`주제 조사 한 번 → 플랫폼별 맞춤 글 분리 작성`)\n\n---\n\n## 2. 매일 작업 순서 (8단계 표준 절차)\n\n### Step 1. 주제 수집\n- 네이버 실시간 검색어 TOP 10 및 주요 국내 이슈 확인\n- [Google Trends](https://trends.google.com/trends/?geo=KR) 상승 검색어 및 관련 검색어 확인\n- 기존 주제 목록(`topics/topic-backlog.md`, `logs/publishing-log.csv`)과 중복 여부 확인\n- 오늘의 후보 주제 5~10개 기록\n\n### Step 2. 주제 평가 (100점 만점 루브릭)\n각 후보를 다음 5가지 기준으로 **1~5점** 평가한다 (합산 × 4 = 100점 만점).\n\n| 평가 항목 | 배점 (1~5점) | 핵심 판단 질문 |\n| :--- | :---: | :--- |\n| **1. 검색 관심도** | 1 ~ 5점 | Google Trends 및 포털에서 최근 검색 관심도가 상승하고 있는가? |\n| **2. 검색 의도의 명확성** | 1 ~ 5점 | 독자가 해결하려는 구체적인 질문(방법·비교·가격·조건)이 명확한가? |\n| **3. 경쟁 콘텐츠의 빈틈** | 1 ~ 5점 | 기존 상위 글에 최신 공식 표, 단계별 절차, 주의사항이 부족한가? |\n| **4. 자료 확인 가능성과 작성 역량** | 1 ~ 5점 | 공식 기관·제조사 자료와 나의 경험/지식으로 정확히 검증해 쓸 수 있는가? |\n| **5. 장기 검색 가능성** | 1 ~ 5점 | 유행이 지나도 몇 주~몇 달 뒤까지 꾸준히 검색될 주제인가? |\n\n- 점수가 높은 주제(70점 이상)를 우선 검토하되, 검색 수요가 불확실하거나 사실 확인이 어려운 주제는 제외한다.\n\n### Step 3. 플랫폼별 주제 결정\n- **네이버**: 시의성, 국내 관심도, 빠른 정보 전달과 공감(5060 품미인생 관점)을 고려한다.\n- **티스토리**: 검색 질문에 대한 구체적인 답(단계별 절차, 조건별 비교표)과 지속성을 고려한다.\n- 동일한 주제를 사용할 경우 **제목과 구성, 독자에게 제공하는 가치를 완전히 차별화**한다 (단순 복사·붙여넣기 금지).\n\n### Step 4. 자료 조사\n- 공식 기관(국민연금공단, 건보공단, 한국은행, 한국거래소 등), 제조사, 서비스 제공자의 자료를 우선 확인한다.\n- 숫자, 날짜, 가격, 세율, 정책 및 제품 사양을 검증한다.\n- 출처 URL과 확인 날짜를 기록한다 (`guidelines/source-policy.md` 준수).\n- 확인하지 못한 사실은 확정적으로 서술하지 않고 `[확인 필요]`로 표시하거나 개인별 조건 차이를 안내한다.\n\n### Step 5. AI 초안 작성\n- 독자가 검색하는 질문에 대한 **핵심 답변을 도입부에서 먼저 제시**한다.\n- 제목과 소제목(H2/H3)을 구체적으로 작성한다.\n- 필요에 따라 **단계별 설명(1단계~4단계), 비교표(Table), 사례 및 주의사항**을 포함한다.\n- 실제로 수행하지 않은 경험을 개인 경험처럼 작성하지 않는다.\n- 다른 글을 단순 복사하거나 문장만 바꾼 콘텐츠를 만들지 않는다.\n\n### Step 6. 품질 검증 (`prompts/fact-check.md` 기준)\n- [ ] 사실과 수치가 공식 출처에 부합하는가?\n- [ ] 제목이 본문에서 실제로 답하는 내용과 일치하는가?\n- [ ] 반복 문장과 불필요한 상투적 서론이 없는가?\n- [ ] 이미지와 인용 자료의 사용 권리가 적절한가?\n- [ ] 개인정보, 저작권, 광고 표시 등 관련 정책을 준수하는가?\n- [ ] 독자가 이 글만 읽고도 실제로 문제를 해결할 수 있는가?\n\n### Step 7. 발행 (`workflow/publishing.md` 기준)\n- 카테고리와 최종 제목 확인\n- 외부 공식 링크와 이미지 정상 노출 확인\n- PC 및 모바일 화면 미리보기 점검 (특히 표 깨짐 여부 확인)\n- 공개 설정 및 검색 허용 확인\n- 게시글 URL과 발행일을 `logs/publishing-log.csv`에 기록\n\n> ⚠️ 자동 초안 생성 배치를 운영하더라도 **최종 사실 검증 및 실제 블로그 발행 승인 단계**는 운영자가 직접 확인한다.\n\n### Step 8. 성과 기록\n`logs/publishing-log.csv`에 아래 항목을 기록하고 추적한다.\n- 발행일 (`date`)\n- 플랫폼 (`platform`: Naver / Tistory)\n- 카테고리 (`category`)\n- 주제 및 제목 (`topic`, `title`)\n- 게시글 URL (`url`)\n- 상태 (`status`: draft / published)\n- 검색 노출(`impressions`) 및 클릭(`clicks`)\n- 방문자 수(`visitors`)\n- 광고 수익(`revenue`: 확인 가능한 경우)\n- 개선할 점(`notes`)\n\n---\n\n## 3. 매일 작업 시간 배분 (30분 표준 루틴)\n\n| 단계 | 작업 내용 | 권장 소요 시간 |\n| :--- | :--- | :---: |\n| **1. 주제 수집 및 선정** | 실시간 검색어 Top 10 & Google Trends 상승 검색어 확인, 100점 평가 | **5분** |\n| **2. 자료 확인** | 공식 기관·제조사 페이지에서 핵심 수치·조건·URL 확인 | **5분** |\n| **3. AI 초안 작성** | 플랫폼별 맞춤 프롬프트(`naver-draft.md`, `tistory-draft.md`)로 초안 생성 | **10분** |\n| **4. 검증 및 편집** | 숫자·연도 대조, 가상 경험 문장 제거, 비교표 및 출처 링크 점검 | **7분** |\n| **5. 발행 및 기록** | 에디터 서식 복사 후 발행, `logs/publishing-log.csv`에 URL 기록 | **3분** |\n| **합계** | **일일 표준 작업 시간** | **총 30분** |\n\n---\n\n## 4. 주간 리뷰 (`workflow/performance-review.md` 연계)\n\n매주 일요일(또는 주 1회) 다음 5가지를 확인하여 `logs/weekly-review.md`에 기록한다.\n1. 어떤 주제와 카테고리에서 검색 노출과 클릭이 발생했는가?\n2. 제목과 본문 도입부 중 클릭률(CTR)과 체류 시간을 높이기 위해 개선할 부분은 무엇인가?\n3. 이슈가 지난 뒤에도 지속적으로 검색 유입이 발생하는 효자 글은 무엇인가?\n4. 다음 주에 후속편이나 연재로 확장할 주제는 무엇인가?\n5. 근거가 부족하거나 성과가 낮은 글을 어떻게 보완할 것인가? *(주의: 성과가 낮다는 이유만으로 글을 성급하게 삭제하지 않고, 충분한 색인·관찰 기간을 거친 뒤 제목·본문 보완 여부를 결정한다.)*\n\n---\n\n## 5. 매일 AI 에이전트(Claude Code / Gemini / Antigravity)에 입력할 실행 명령\n\n```markdown\n이 저장소의 README.md와 workflow/daily-workflow.md를 먼저 읽어 주세요.\n\n오늘의 블로그 콘텐츠 작업을 시작합니다.\n\n1. topics/topic-backlog.md와 logs/publishing-log.csv에서 기존 주제와 중복되는 항목을 확인합니다.\n2. 네이버 블로그용 실시간 이슈 주제 후보와 티스토리용 검색형 주제 후보를 구분합니다.\n3. 실제 최신 검색 데이터를 확인할 수 없는 경우 검색량이나 순위를 추측하지 말고, 추가 조사가 필요한 항목으로 표시합니다.\n4. 후보별 검색 의도, 장기성, 경쟁 콘텐츠의 빈틈, 사실 확인 가능성을 1~5점으로 평가합니다.\n5. 우선 작성할 주제를 추천하고, 선정 이유와 필요한 공식 출처를 제시합니다.\n6. 승인된 주제에 대해서만 해당 플랫폼의 작성 지침(guidelines/naver-blog.md, guidelines/tistory-seo.md)에 따라 초안을 생성합니다.\n7. prompts/fact-check.md와 workflow/publishing.md 기준으로 검토하고, 미확인 사실과 발행 전 점검 항목을 별도로 출력합니다.\n```\n"}, "wf-topic-selection": {"metadata": {"id": "wf-topic-selection", "category": "03. AI 워크플로우", "category_icon": "🎯", "title": "주제 선정 규칙 및 100점 평가표 (topic-selection)", "file_path": "workflow/topic-selection.md", "url_path": "../workflow/topic-selection.md", "desc": "실시간 이슈 vs 장기 검색 질문 구분 기준 및 5대 평가 루브릭"}, "content": "# Topic Selection Rules (네이버 · 티스토리 주제 선정 규칙)\n\n## 1. 플랫폼별 주제 선정 핵심 원칙\n\n| 구분 | 🟢 네이버 블로그 (`품미인생`) | 🟠 티스토리 블로그 (`똑똑한 생활탐구`) |\n| :--- | :--- | :--- |\n| **핵심 소스** | 실시간 검색어 TOP 10, 당일 주요 뉴스 | Google Trends 상승 검색어, 서치 콘솔 유입어 |\n| **주제 형태** | 시의성 있는 이슈 해설 + 5060 생활·자산 체크포인트 | **구체적인 방법·비교·가격·조건·해결 순서 질문** |\n| **권장 주기** | 하루 3~5편 (메인 1편 + 품미인생 5대 테마 매칭 글) | 하루 1편 또는 주 5편 (엄선된 고득점 주제) |\n| **수명 주기** | 단기 폭발적 유입 + 이웃 소통 | 수주~수개월 이상 누적되는 구글 장기 검색 자산 |\n\n---\n\n## 2. 검색어를 플랫폼별 주제로 변환하는 매트릭스\n\n같은 검색어를 발견하더라도 네이버와 티스토리는 아래와 같이 **서로 다른 질문과 제목**으로 분리합니다.\n\n| 발견한 트렌드 키워드 | 🟢 네이버 블로그 주제 방향 (이슈·공감·요약) | 🟠 티스토리 블로그 주제 방향 (절차·비교표·공식기준) | 티스토리 추천도 |\n| :--- | :--- | :--- | :---: |\n| **경상수지 / 환율** | 경상수지 흑자 뉴스 속 5060 노후 자산 방어 팁 3가지 | 국민연금 예상 수령액 조회 방법 및 물가상승률 반영 기준 정리 | **높음** |\n| **엔비디아 / AI** | 5060을 위한 AI 트렌드와 일상 속 스마트 활용기 | ChatGPT 등 AI 블로그 초안의 사실관계(팩트체크) 검증 5단계 방법 | **높음** |\n| **주얼리 / 금시세** | 금값 상승 속 파인주얼리 열풍과 안전자산 이야기 | 순금(24K) 주얼리 vs 골드바 vs KRX 금현물 수수료·세금 비교표 | **높음** |\n| **새 스마트폰 출시** | 신형 스마트폰 출시 소식과 시니어 체감 변화 포인트 | 모델별 상세 스펙·가격·이전 세대 차이점 비교표 및 초기 설정법 | **높음** |\n| **정부 지원금 발표** | 놓치면 아까운 신규 정부 지원금 핵심 소식 요약 | 지원 대상·제외 조건, 신청 기간·절차, 온라인 오류 해결 방법 | **높음** |\n| **스포츠 / 연예 이슈** | 오늘 화제의 경기·인물 소식과 인생 2막 에세이 | *(단기 이슈로 장기 검색 가치가 낮아 티스토리 발행 보류)* | **낮음(보류)** |\n\n---\n\n## 3. 티스토리 주제 5대 평가 기준표 (100점 만점)\n\n매일 후보 키워드 5~10개를 아래 기준으로 채점하여 **70점 이상**인 주제를 티스토리 작성 대상으로 확정합니다.\n\n1. **검색 관심도 상승 (1~5점 × 4 = 20점)**\n   - Google Trends에서 최근 7일·30일 관심도가 상승 추세인가?\n2. **검색 의도 명확성 (1~5점 × 4 = 20점)**\n   - 검색자가 원하는 답(`어떻게 조회하는가?`, `A와 B의 차이는 무엇인가?`, `조건은 무엇인가?`)을 한 문장으로 정의할 수 있는가?\n3. **경쟁 글의 빈틈 (1~5점 × 4 = 20점)**\n   - 구글 상위 검색 결과에 최신 연도 공식 표가 없거나 설명이 불친절해 개선 여지가 있는가?\n4. **내가 다룰 수 있는 정도 (1~5점 × 4 = 20점)**\n   - 공식 기관 자료와 직접 확인한 절차를 바탕으로 오류 없이 정확히 작성할 수 있는가?\n5. **장기 검색 가능성 (1~5점 × 4 = 20점)**\n   - 당일 뉴스가 끝난 뒤에도 3개월~1년 뒤 독자가 계속 검색할 주제인가?\n\n### 점수 구간별 판정 기준\n- **80 ~ 100점 (`최우선 작성`)**: 즉시 티스토리 대표 정보 글로 작성 (표와 공식 절차 상세 수록)\n- **70 ~ 79점 (`추가 검토 후 작성`)**: 검색 질문을 더 구체적으로 좁힌 뒤 작성\n- **70점 미만 (`티스토리 보류`)**: 네이버 실시간 이슈 글로만 소화하거나 백로그에서 제외\n"}, "wf-article-production": {"metadata": {"id": "wf-article-production", "category": "03. AI 워크플로우", "category_icon": "✍️", "title": "초안 생성·검증·편집 절차 (article-production)", "file_path": "workflow/article-production.md", "url_path": "../workflow/article-production.md", "desc": "주제 조사 1회 → 플랫폼별 원고 2편 분리 제작 및 팩트체크 프로세스"}, "content": "# Article Production Process (초안 생성 · 검증 · 편집 표준 절차)\n\n## 1. '주제 조사 1회 → 플랫폼별 원고 2편' 생산 원칙\n\n작업 피로도를 줄이면서 두 블로그의 품질을 동시에 유지하기 위해 **자료 조사는 한 번에 수행하되, 원고 작성은 플랫폼 문법에 맞게 완전히 분리**합니다.\n\n```\n[공통 1단계: 공식 자료 조사 및 팩트 확인 (5분)]\n        ├── 🟢 [네이버 초안 생성] : 도입부 공감 + 핵심 3대 포인트 + 인생 2막 통찰 + 스마트블록 태그\n        └── 🟠 [티스토리 초안 생성] : 결론 선제시 + 단계별 절차(1~4단계) + 조건별 비교표 + 공식 URL + 주의사항\n```\n\n---\n\n## 2. 단계별 원고 제작 프로세스\n\n### Step 1. 공식 자료 수집 및 팩트 시트 작성 (5분)\n초안을 생성하기 전 아래 4가지를 먼저 메모합니다.\n1. **공식 출처 URL**: 공단, 정부 부처, 한국은행, 한국거래소, 공식 제조사 고객센터 URL\n2. **핵심 수치·조건**: 기준 연도(2026년), 대상 연령, 소득 기준, 수수료율/세율, 신청 기간\n3. **절차 순서**: 실제 사이트 접속 경로 (`홈페이지 → 메뉴명 → 인증 → 결과 확인`)\n4. **예외 및 주의사항**: 감액 조건, 제외 대상, 개인별 차이 발생 요인\n\n### Step 2. 플랫폼별 AI 초안 생성 (10분)\n- **네이버용 원고**: `prompts/naver-draft.md` 프롬프트 사용\n  - 친근하고 신뢰감 있는 '품미인생' 페르소나 유지\n  - 모바일 가독성을 위한 짧은 문단, 인용구, 핵심 요약 리스트 활용\n- **티스토리용 원고**: `prompts/tistory-draft.md` 프롬프트 사용\n  - 객관적이고 정확한 정보 편집자 톤앤매너 유지\n  - **7단계 표준 구조**: `1. 도입부 → 2. 핵심 내용 요약 → 3. 단계별 설명 → 4. 사례 또는 비교표 → 5. 주의사항 → 6. 결론 → 7. 참고 자료`\n\n### Step 3. 사실 검증 및 휴먼 터치 편집 (7분)\nAI가 생성한 초안에서 아래 항목을 반드시 수정·편집합니다.\n1. **할루시네이션(허위 수치) 교정**: 공식 자료에서 확인되지 않은 숫자·통계·가격은 삭제하거나 공식 확인 경로로 대체합니다.\n2. **가상 경험담 제거**: 직접 겪지 않은 일을 *\"제가 어제 직접 신청해 보니...\"*처럼 서술한 문장을 객관적 절차 설명으로 수정합니다.\n3. **비교표 가정 조건 명시**: 모든 계산 사례와 비교표 하단에 기준 연도와 가정 조건을 명시합니다.\n4. **문장 중복 제거**: 상투적인 AI 서론(*\"급변하는 현대 사회에서...\"*)을 걷어내고 첫 문단부터 독자의 질문에 바로 답합니다.\n"}, "wf-publishing": {"metadata": {"id": "wf-publishing", "category": "03. AI 워크플로우", "category_icon": "✅", "title": "발행 전 최종 체크리스트 (publishing)", "file_path": "workflow/publishing.md", "url_path": "../workflow/publishing.md", "desc": "발행 전 3대 팩트체크 질문 및 네이버·티스토리 점검표"}, "content": "# Publishing Checklist (발행 전 최종 점검 및 기록 절차)\n\n## 1. 발행 전 필수 3대 핵심 질문\n\n모든 글은 발행 버튼을 누르기 전에 아래 세 가지를 통과해야 합니다.\n\n1. **[사실 일치]** 공식 자료와 본문 내 숫자·날짜·조건이 정확히 일치하는가?\n2. **[제목 일치]** 제목이 본문에서 실제로 답하는 핵심 질문과 과장 없이 일치하는가?\n3. **[경험 진실성]** 직접 해보지 않은 일을 본인의 실제 경험처럼 허위로 표현하지 않았는가?\n\n---\n\n## 2. 플랫폼별 발행 전 점검 체크리스트\n\n### 🟢 네이버 블로그 (`blog.naver.com/ms7park`) 발행 체크리스트\n- [ ] 포스트 뷰어(`.html`)에서 **[🟢 네이버 스마트에디터 서식 복사]** 버튼을 사용해 `**` 기호 없이 깔끔하게 붙여넣었는가?\n- [ ] 제목 앞쪽 15자 이내에 핵심 타겟 키워드가 자연스럽게 배치되었는가?\n- [ ] 본문 소제목(인용구/구분선)이 3~4개로 명확히 나뉘어 있는가?\n- [ ] 저작권 문제가 없는 이미지(직접 촬영 사진, 공식 화면 캡처, 무료 라이선스)를 사용했는가?\n- [ ] 하단 해시태그에 `#은퇴블로그` 대신 `#인생2막`, `#품미인생`, `#디지털연금` 및 주제 키워드가 들어갔는가?\n- [ ] 공개 설정이 **전체 공개**로 되어 있는가?\n\n### 🟠 티스토리 블로그 (`똑똑한 생활탐구`) 발행 체크리스트\n- [ ] 포스트 뷰어(`.html`)에서 **[🟠 티스토리 에디터(기본모드) 서식 복사]** 또는 마크다운 원문으로 표·소제목이 깨짐 없이 입력되었는가?\n- [ ] 5대 카테고리(`은퇴·연금·생활비`, `AI·IT 활용법`, `제품 비교·사용법`, `골프·취미`, `반려동물·생활정보`) 중 정확한 카테고리를 선택했는가?\n- [ ] 도입부 상단에 **핵심 답변 요약 박스**가 배치되어 있는가?\n- [ ] 본문 내 **조건별 비교표(Table)**가 모바일 미리보기에서도 가로 잘림 없이 잘 보이는가?\n- [ ] 하단 **참고 자료** 섹션의 공식 기관 외부 링크가 새 창에서 정상적으로 열리는가?\n- [ ] 네이버 블로그에 올린 원고와 문장·구성이 중복되지 않는 독창적인 글인가?\n\n---\n\n## 3. 발행 직후 기록 절차 (`Step 8`)\n\n1. 발행된 실제 게시글을 브라우저에서 열어 링크와 이미지를 최종 확인합니다.\n2. `logs/publishing-log.csv` 파일에 오늘 발행한 글의 `날짜, 플랫폼, 카테고리, 주제, 제목, URL, 상태(published)`를 한 줄 추가합니다.\n3. 티스토리 글의 경우 Google Search Console에서 색인 생성 현황을 주기적으로 점검합니다.\n"}, "wf-performance-review": {"metadata": {"id": "wf-performance-review", "category": "03. AI 워크플로우", "category_icon": "📈", "title": "주간 성과 분석 및 개선 가이드 (performance-review)", "file_path": "workflow/performance-review.md", "url_path": "../workflow/performance-review.md", "desc": "노출·클릭·체류시간 분석 및 다음 주 확장 주제 선정 루프"}, "content": "# Weekly Performance Review Guide (주간 성과 분석 및 개선 절차)\n\n## 1. 주간 리뷰 목적\n\n블로그 수익화(은퇴 후 월 50만~300만 원 파이프라인)는 단순 발행량보다 **어떤 주제가 검색 노출과 클릭, 체류 시간으로 이어지는지 데이터로 확인하고 다음 주 주제 선정에 반영하는 피드백 루프**에서 결정됩니다.\n\n---\n\n## 2. 플랫폼별 핵심 확인 지표\n\n네이버와 티스토리는 검색 알고리즘과 통계 항목이 다르므로 무리하게 동일 기준으로 비교하지 않고 각 플랫폼의 핵심 지표만 확인합니다.\n\n| 구분 | 🟢 네이버 블로그 (네이버 크리에이터 어드바이저) | 🟠 티스토리 블로그 (구글 서치 콘솔 & 애드센스) |\n| :--- | :--- | :--- |\n| **핵심 지표 1** | 일별 조회수 및 순방문자수 | **구글 검색 노출수(Impressions) 및 클릭수(Clicks)** |\n| **핵심 지표 2** | 유입 검색어 순위 (스마트블록 유입 비중) | **평균 게재순위(Position) 및 클릭률(CTR)** |\n| **핵심 지표 3** | 평균 체류시간 및 이웃 공감·댓글 반응 | **색인 생성 페이지 수** 및 애드센스 페이지 RPM/수익 |\n\n---\n\n## 3. 주간 리뷰 5대 점검 질문 (매주 일요일 15분)\n\n1. **효자 주제 발굴**: 이번 주 가장 많은 검색 노출과 유입을 만든 상위 3개 글은 무엇인가?\n2. **노출 대비 클릭률(CTR) 개선**: 구글 서치 콘솔에서 **노출은 많이 되지만 클릭이 적은 검색어**는 무엇인가? (→ 제목을 더 구체적인 질문 해결형으로 수정하거나 후속 글 작성)\n3. **장기 검색 지속성 확인**: 작성한 지 1~2주 이상 지났음에도 매일 꾸준히 유입이 들어오는 주제는 무엇인가?\n4. **다음 주 확장 주제 선정**: 유입이 확인된 카테고리에서 파생할 수 있는 후속 질문 5~7개는 무엇인가? (`topics/topic-backlog.md`에 추가)\n5. **저성과 글 보완 계획**: 색인이 누락되었거나 최신 공식 표/절차 설명이 부족한 글 중 업데이트할 대상은 무엇인가?\n\n> ⚠️ **주의사항 (성급한 글 삭제 금지)**  \n> 구글 검색 색인과 상위 노출에는 수주 이상의 시간이 걸릴 수 있습니다. 초기 조회수가 낮다는 이유만으로 글을 성급하게 삭제하거나 비공개로 돌리지 마세요. 공식 자료 보강과 소제목·비교표 개선을 통해 문서 품질을 높이는 것이 유리합니다.\n"}, "practical-prompts": {"metadata": {"id": "practical-prompts", "category": "04. 실전 프롬프트", "category_icon": "💬", "title": "블로그 작성 실전 프롬프트 라이브러리", "file_path": "docs/04-prompts/01-practical-prompts.md", "url_path": "04-prompts/01-practical-prompts.md", "desc": "후킹 제목, 도입부, 본문 확장, SEO 메타태그 복사-붙여넣기 템플릿"}, "content": "# 💬 블로그 작성 즉시 활용 실전 프롬프트 라이브러리\n\nAI(Gemini, ChatGPT, Claude) 창에 그대로 복사해서 쓸 수 있는 실전 프롬프트 템플릿입니다.  \n괄호 `[ ]` 안의 내용만 내 상황에 맞게 바꾸어 입력하세요.\n\n---\n\n## 1. 클릭률(CTR) 3배 높이는 제목 생성 프롬프트\n\n```markdown\n당신은 10년 차 디지털 마케팅 카피라이터이자 블로그 전문가입니다.\n\n[주제: 예 - 50대 골프 비거리 늘리기]\n[핵심 키워드: 예 - 50대 골프 스윙, 비거리 늘리는 법]\n[타겟 독자: 예 - 50~60대 아마추어 골퍼]\n\n위 주제로 독자의 시선을 사로잡고 클릭률을 극대화할 수 있는 블로그 제목 10개를 작성해 줘.\n다음 4가지 유형을 골고루 섞어줘:\n1. 숫자/손실 회피형 (예: \"모르면 500만 원 손해 보는...\")\n2. 질문/공감형 (예: \"아직도 힘으로만 치시나요?\")\n3. 경험/실제 후기형 (예: \"제가 3달 만에 20m 늘린 비결\")\n4. 초간단 해결책형 (예: \"딱 1가지만 바꿨더니...\")\n\n*주의: 낚시성 제목은 피하고, 핵심 키워드가 가능한 앞쪽에 배치되게 해줘.*\n```\n\n---\n\n## 2. 첫 3초 만에 독자를 사로잡는 도입부(후킹) 프롬프트\n\n```markdown\n블로그 글의 도입부(첫인사 및 본론 직전까지 약 300~400자)를 작성해 줘.\n\n- 주제: [예 - 은퇴 후 건강보험료 지역가입자 전환 시 줄이는 법]\n- 타겟 독자의 고통(Pain Point): [예 - 직장 다닐 땐 몰랐는데 퇴직 후 건보료 고지서 받고 깜짝 놀람]\n- 필자의 페르소나: [예 - 작년에 정년퇴직한 60대 초반 선배 블로거]\n\n[도입부 작성 원칙]:\n1. 딱딱한 첫인사(\"안녕하세요~ 오늘은...\")는 생략하고, 공감 가는 상황 질문으로 시작할 것.\n2. 필자의 실제 고민과 당황스러웠던 감정을 짧게 공유할 것.\n3. \"이 글을 끝까지 읽으시면 딱 2가지 서류로 월 10만 원 이상 아끼는 비결을 알게 됩니다\"처럼 명확한 독자 혜택을 제시할 것.\n4. 문장은 2~3줄씩 짧게 끊어서 모바일에서 읽기 편하게 해줘.\n```\n\n---\n\n## 3. 구조화된 본문(소제목별) 작성 프롬프트\n\n```markdown\n블로그 본문 중 소제목 하나를 작성하려고 해.\n\n- 소제목: [예 - 국민연금 연기연금 vs 조기연금, 나에게 유리한 선택은?]\n- 포함할 내용: [신청 나이, 감액/증액 비율, 손익분기점 나이, 상황별 추천]\n- 문체: 친절하고 신뢰감 있는 경어체 (~해요, ~합니다)\n\n[요구사항]:\n1. 복잡한 규정을 누구나 이해하기 쉽게 실생활 예시로 풀어줘.\n2. 한눈에 비교할 수 있는 표(Markdown Table)를 1개 포함해 줘.\n3. 중요한 핵심 문장은 굵은 글씨(Bold)나 불릿 기호(▪)로 시각화해 줘.\n4. \"~에 대해 알아보았습니다\" 같은 지루한 문구는 쓰지 말아줘.\n```\n\n---\n\n## 4. 'AI 냄새' 없애고 감성을 불어넣는 윤문 프롬프트\n\n```markdown\n아래 글은 AI가 작성한 초안이야. 기계적인 느낌이 나지 않도록 자연스러운 사람의 문체로 리라이팅(윤문)해 줘.\n\n[내가 실제로 겪은 경험 메모]:\n[예 - \"지난주에 친구들이랑 파3 골프장에 갔는데, 60m 어프로치에서 계속 뒤땅이 나서 망신당함. 프로한테 원포인트 레슨 받고 체중을 왼발에 두는 법을 배움.\"]\n\n[수정할 원문 초안]:\n\"\"\"\n(여기에 AI가 쓴 초안 붙여넣기)\n\"\"\"\n\n[윤문 지침]:\n1. 위 '내가 겪은 경험 메모'를 글의 중간에 자연스럽게 1인칭 관점으로 녹여줘.\n2. \"현대 사회에서\", \"중요한 요소로 작용합니다\", \"결론적으로\" 등 진부한 상투어를 전부 삭제해 줘.\n3. 동네 이웃이나 후배에게 편안하게 커피 한잔 마시며 이야기해 주듯 구어체 느낌을 살려줘.\n```\n\n---\n\n## 5. 댓글/공감 및 수익 링크 클릭을 부르는 마무리(CTA) 프롬프트\n\n```markdown\n블로그 글의 마무리(결론) 3~4문장을 작성해 줘.\n\n- 주제: [예 - 가성비 시니어 골프 거리측정기 추천]\n- 유도할 행동(CTA): [예 - 독자의 댓글 의견 묻기 + 본문 속 할인 링크 확인 유도]\n\n[작성 원칙]:\n1. 오늘 핵심 내용을 딱 3줄로 요약해 줘.\n2. 독자에게 질문을 던져 댓글을 유도해 줘 (예: \"선배님들은 라운드 때 어떤 장비 쓰시나요? 댓글로 알려주세요!\")\n3. 자연스럽게 정보나 링크를 다시 한번 상기시켜 줘.\n```\n"}, "prompt-topic-selection": {"metadata": {"id": "prompt-topic-selection", "category": "04. 실전 프롬프트", "category_icon": "💬", "title": "통합 주제 선정 프롬프트 (prompts/topic-selection)", "file_path": "prompts/topic-selection.md", "url_path": "../prompts/topic-selection.md", "desc": "실시간 Top 10 & Google Trends 상승 검색어 100점 평가 프롬프트"}, "content": "# Topic Selection Prompt (네이버 · 티스토리 통합 주제 선정 프롬프트)\n\n## 1. 프롬프트 목적\n오늘의 실시간 검색어 Top 10과 Google Trends 상승 검색어를 입력받아, **네이버용 실시간 이슈 주제**와 **티스토리용 장기 검색형 질문 주제(100점 평가 루브릭 적용)**를 분리 추천받는 프롬프트입니다.\n\n---\n\n## 2. 복사해서 바로 쓰는 프롬프트\n\n```markdown\n당신은 네이버 블로그(실시간 이슈·공감 중심)와 티스토리 블로그(구글 검색·문제 해결·애드센스 중심)를 동시에 운영하는 콘텐츠 전략가입니다.\n\n아래 후보 검색어 목록과 기존 작성 이력을 바탕으로 오늘 작성할 주제를 선별해 주세요.\n\n## 입력 데이터\n- 오늘의 후보 검색어(실시간 Top 10 / Google Trends): [검색어 목록 입력]\n- 블로그 핵심 테마:\n  * 네이버(품미인생): 노후 자산관리·연금·절세, 시니어 건강, 맛있는 일상, 취미·스포츠, 인생 2막\n  * 티스토리(똑똑한 생활탐구): 은퇴·연금·생활비(30%), AI·IT 활용법(25%), 제품 비교·사용법(25%), 골프·취미(10%), 반려동물·생활정보(10%)\n\n## 평가 및 출력 규칙\n1. 실제 최신 검색 데이터를 확인할 수 없는 경우 검색량이나 순위를 추측하지 말고 [추가 조사 필요]로 표시합니다.\n2. 각 후보 검색어를 다음 5가지 기준(각 1~5점, 총점 100점 환산)으로 채점합니다:\n   - 검색 관심도 상승 (1~5)\n   - 검색 의도 명확성 (1~5)\n   - 경쟁 콘텐츠의 빈틈 (1~5)\n   - 자료 확인 가능성과 작성 역량 (1~5)\n   - 장기 검색 가능성 (1~5)\n3. 네이버 블로그용 추천 주제(3~5개)와 티스토리용 추천 주제(1~3개, 70점 이상만 선정)를 명확히 분리합니다.\n4. 티스토리 주제는 검색어 단어 자체가 아니라 독자가 해결하려는 구체적인 질문(방법·비교·조건·절차) 형태로 변환하고, 확인해야 할 공식 출처 기관을 함께 제시합니다.\n```\n"}, "prompt-naver-draft": {"metadata": {"id": "prompt-naver-draft", "category": "04. 실전 프롬프트", "category_icon": "🟢", "title": "네이버 초안 작성 프롬프트 (prompts/naver-draft)", "file_path": "prompts/naver-draft.md", "url_path": "../prompts/naver-draft.md", "desc": "품미인생 페르소나 및 스마트블록 최적화 초안 생성 프롬프트"}, "content": "# Naver Blog Draft Prompt (네이버 블로그 '품미인생' 초안 작성 프롬프트)\n\n## 1. 프롬프트 목적\n네이버 스마트블록 및 C-Rank / D.I.A 로직에 최적화된 친근하고 가독성 높은 네이버 블로그 원고(약 1,500~2,000자)를 작성하는 프롬프트입니다.\n\n---\n\n## 2. 복사해서 바로 쓰는 프롬프트\n\n```markdown\n당신은 든든한 노후 자산과 맛있는 일상을 가꾸는 5060 시니어 블로거 '품미인생(品味人生)'입니다.\n아래 주제로 네이버 블로그 스마트블록 상위 노출에 적합한 포스팅 초안을 작성해 주세요.\n\n## 입력 정보\n- 오늘의 키워드 / 이슈: [키워드 및 관련 뉴스 요약]\n- 연결할 품미인생 테마: [자산관리 / 건강 / 식도락 / 취미 / 인생2막 중 선택]\n- 확인된 공식 팩트: [공식 발표 내용 또는 핵심 기준]\n\n## 작성 규칙\n1. 도입부에서 오늘 화제가 된 배경을 자연스럽게 짚어주고, 독자(5060 은퇴 준비자 및 일반 독자)가 궁금해할 핵심 질문 2가지를 던집니다.\n2. 본문은 3개의 명확한 소제목(H2/H3)으로 구성하며, 모바일에서 읽기 편하도록 문단을 짧게 나눕니다.\n3. 자극적인 추측이나 허위 개인 경험담을 만들지 않고, 실생활에 바로 적용할 수 있는 3가지 실천 팁을 정리합니다.\n4. 인생의 경륜이 느껴지는 따뜻한 맺음말과 댓글 소통 유도 문구를 포함합니다.\n5. 하단에 스마트블록 추천 해시태그 8~10개를 작성하되, `#은퇴블로그` 태그는 절대 사용하지 말고 `#인생2막 #품미인생 #디지털연금`을 포함합니다.\n```\n"}, "prompt-tistory-draft": {"metadata": {"id": "prompt-tistory-draft", "category": "04. 실전 프롬프트", "category_icon": "🟠", "title": "티스토리 검색형 초안 프롬프트 (prompts/tistory-draft)", "file_path": "prompts/tistory-draft.md", "url_path": "../prompts/tistory-draft.md", "desc": "구글 검색 유입용 7단계 정보 글 & 비교표 생성 프롬프트"}, "content": "# Tistory Search-Oriented Draft Prompt (티스토리 검색형 블로그 글 작성 지침)\n\n## 1. 프롬프트 목적\n구글 검색(SEO) 유입과 애드센스 수익화를 위해 독자의 구체적인 질문을 정확하고 구조적으로 해결하는 티스토리 7단계 정보 글 작성 프롬프트입니다.\n\n---\n\n## 2. 복사해서 바로 쓰는 프롬프트\n\n```markdown\n# 티스토리 검색형 블로그 글 작성 지침\n\n당신은 정확성과 실용성을 중시하는 블로그 편집자입니다.\n\n## 작성 목표\n독자가 검색을 통해 유입되어 궁금한 문제를 해결할 수 있는 티스토리용 정보 글을 작성합니다.\n\n## 입력 정보\n- 주제: [작성할 주제]\n- 주요 독자: [대상 독자]\n- 검색할 질문: [독자가 해결하려는 문제]\n- 참고 자료: [공식 URL 및 확인된 자료]\n- 직접 확인한 경험: [있으면 입력, 없으면 없음]\n\n## 작성 규칙\n1. 검색 질문에 대한 핵심 답변을 도입부에서 먼저 제시합니다.\n2. 제목은 구체적이고 자연스럽게 작성합니다.\n3. 본문은 소제목과 단계별 설명(1단계~4단계)으로 구성합니다.\n4. 확인되지 않은 통계, 가격, 정책, 개인 경험을 만들지 않습니다.\n5. 최신 정보가 필요한 내용은 공식 자료를 우선 확인하고, 확인하지 못한 사실은 [확인 필요]라고 표시합니다.\n6. 다른 블로그의 문장을 복사하거나 비슷한 문장을 반복하지 않습니다.\n7. 키워드를 부자연스럽게 반복하지 않습니다.\n8. 실제로 도움이 되는 예시, 조건별 비교표(Markdown Table, 가정 조건 명시), 주의사항을 주제에 맞게 포함합니다.\n9. 출처가 있는 경우 해당 주장 가까이에 공식 출처 링크를 제시합니다.\n10. 의료·금융·세금·법률 관련 주제는 단정적인 조언을 피하고 개인별 조건 차이를 설명합니다.\n\n## 출력 형식\n1. 제목 후보 3개\n2. 최종 추천 제목\n3. 핵심 답변 요약\n4. 완성된 본문 (1.도입부 → 2.핵심 내용 요약 → 3.단계별 설명 → 4.사례 또는 비교표 → 5.주의사항 → 6.결론 → 7.참고 자료)\n5. 사실 확인이 필요한 항목\n6. 참고 자료 목록 (공식 기관 URL)\n7. 발행 전 검토 체크리스트\n```\n"}, "prompt-wordpress-draft": {"metadata": {"id": "prompt-wordpress-draft", "category": "04. 실전 프롬프트", "category_icon": "🔵", "title": "워드프레스 코너스톤 초안 프롬프트 (prompts/wordpress-draft)", "file_path": "prompts/wordpress-draft.md", "url_path": "../prompts/wordpress-draft.md", "desc": "영문 Slug, Meta Description, Key Takeaways, 비교표, FAQ 3문 3답 생성 프롬프트"}, "content": "# WordPress Cornerstone SEO Draft Prompt (워드프레스 구텐베르크 & Rank Math 최적화 프롬프트)\n\n## 1. 프롬프트 목적\n구글 검색(Google SEO) 상위 노출과 Rank Math / Yoast SEO 점수 최적화를 위해 **영문 URL 슬러그, 메타 설명, 핵심 요약 박스, 단계별 절차, 비교표, FAQ 3문 3답, 공식 외부 링크**를 모두 포함한 워드프레스 전용 글을 작성하는 프롬프트입니다.\n\n---\n\n## 2. 복사해서 바로 쓰는 프롬프트\n\n```markdown\n# 워드프레스(WordPress) 검색형 코너스톤 블로그 글 작성 지침\n\n당신은 구글 SEO(E-E-A-T)와 워드프레스 구텐베르크(Gutenberg) 에디터 구조에 정통한 전문 콘텐츠 에디터입니다.\n\n## 입력 정보\n- 주제: [작성할 주제]\n- Focus Keyphrase (핵심 키워드): [메인 타겟 키워드]\n- 검색 질문: [독자가 해결하려는 구체적인 질문]\n- 공식 참고 자료: [공단·정부·제조사 공식 URL]\n\n## 작성 규칙\n1. 네이버·티스토리 원고와 문장이 중복되지 않도록 독립적인 심층 가이드북 형태로 작성합니다.\n2. 상단에 워드프레스 SEO 설정용 메타데이터(Focus Keyphrase, SEO Title, 영문 URL Slug, Meta Description 155자 이내)를 먼저 제시합니다.\n3. 본문은 H2(##)와 H3(###) 계층 구조를 엄격히 지키고, 도입부 직후 핵심 답변 요약(Key Takeaways) 박스를 배치합니다.\n4. 확인되지 않은 통계나 가상 경험담을 만들지 않으며, 조건별 비교표(Table)에는 기준 연도와 가정 조건을 명시합니다.\n5. 글 하단에 구글 리치 스니펫(FAQ Schema) 노출을 위한 '자주 묻는 질문(FAQ) 3가지'와 공식 사이트 참고 링크를 포함합니다.\n\n## 출력 형식\n1. 워드프레스 SEO 메타 설정표 (Focus Keyphrase / SEO Title / 영문 Slug / Meta Description)\n2. 제목 후보 3개 & 최종 제목\n3. 핵심 요약 콜아웃 (Key Takeaways)\n4. 본문 (도입부 → 단계별 가이드 → 조건별 비교표 → 주의사항 → 결론)\n5. 자주 묻는 질문 (FAQ 3문 3답)\n6. 공식 참고 자료 (Outbound Links)\n7. Rank Math / Yoast 발행 전 SEO 체크리스트\n```\n"}, "prompt-fact-check": {"metadata": {"id": "prompt-fact-check", "category": "04. 실전 프롬프트", "category_icon": "🔍", "title": "팩트체크 & 품질 검증 프롬프트 (prompts/fact-check)", "file_path": "prompts/fact-check.md", "url_path": "../prompts/fact-check.md", "desc": "할루시네이션 수치, 가상 경험담, 과장 제목 교정 프롬프트"}, "content": "# Fact-Check & Quality Verification Prompt (초안 사실 검증 프롬프트)\n\n## 1. 프롬프트 목적\nAI가 작성한 네이버·티스토리 블로그 초안을 발행하기 전, 할루시네이션(사실 오류), 가상 경험담, 과장된 제목, 정책 위반 요소를 검출하고 교정하는 프롬프트입니다.\n\n---\n\n## 2. 복사해서 바로 쓰는 프롬프트\n\n```markdown\n당신은 엄격한 팩트체커이자 웹 출판 에디터입니다.\n아래 블로그 초안을 검토하여 발행 전 수정해야 할 항목을 찾아내고 교정본을 제시해 주세요.\n\n## 검토 대상 원고\n[검토할 초안 붙여넣기]\n\n## 참고한 공식 출처\n[공식 사이트 URL 및 기준 수치]\n\n## 필수 점검 기준\n1. [수치·법령 검증]: 본문 내 연도, 날짜, 세율, 수수료, 지원금, 연령 기준이 공식 자료와 일치하는가? 확인되지 않은 숫자가 있다면 지적하고 안전한 표현으로 수정하세요.\n2. [제목-본문 일치]: 제목에서 약속한 질문의 답이 도입부와 본문에 명확히 들어 있는가? 과장되거나 낚시성 표현이 있다면 수정하세요.\n3. [가상 경험 배제]: 직접 겪지 않은 일을 1인칭 실제 경험처럼 지어낸 문장이 있는가? 있다면 객관적인 절차 안내 문장으로 교정하세요.\n4. [가정 조건 명시]: 계산 사례나 비교표에 기준 연도(2026년)와 가정 조건, 개인별 차이 유의사항이 명시되어 있는가?\n5. [중복 및 상투어 제거]: 불필요하게 반복되는 서론이나 키워드 나열을 삭제하세요.\n\n## 출력 형식\n1. 발견된 수정 필요 항목 (위험도: 높음/보통/낮음)\n2. 공식 자료 추가 확인이 필요한 문장 목록\n3. 팩트체크가 반영된 최종 교정 원고\n```\n"}, "blog-templates": {"metadata": {"id": "blog-templates", "category": "05. 글쓰기 템플릿 & 가이드라인", "category_icon": "📑", "title": "고수익 블로그 글쓰기 4대 표준 템플릿", "file_path": "docs/05-templates/01-blog-templates.md", "url_path": "05-templates/01-blog-templates.md", "desc": "정보형, 솔직 리뷰형, 경험 에세이형, 가이드북형 마크다운 구조"}, "content": "# 📑 고수익 블로그 글쓰기 4대 표준 템플릿\n\n서식이나 구조를 고민할 필요 없이, 아래 마크다운 서식을 복사해 빈칸을 채우거나 AI에게 \"이 서식에 맞춰 글을 써줘\"라고 요청하면 즉시 완성도 높은 포스팅이 만들어집니다.\n\n---\n\n## 템플릿 1: 정보 가이드형 (연금, 절세, 복지 제도, 노하우)\n> **목적**: 검색 유입 극대화, 구글 애드센스 고수익, 공유/스크랩 유도\n\n```markdown\n# [클릭을 부르는 제목: 예 - 2026년 기초연금 수급 자격 완벽 정리 (내가 대상자일까?)]\n\n(여기에 대표 이미지 1장 삽입)\n\n직장 생활 은퇴 후 매달 들어오는 연금이나 정부 혜택, 복잡해서 놓치고 계시진 않나요?\n저 역시 퇴직 후 관련 제도를 알아보며 '미리 알았더라면 수백만 원은 더 챙겼을 텐데' 하고 아쉬웠던 순간이 많았습니다.\n\n오늘은 2026년 최신 기준으로 **[주제 키워드]**의 대상 기준과 신청 꿀팁을 제가 직접 겪은 경험을 바탕으로 알기 쉽게 정리해 드립니다.\n\n---\n\n## 1. [주제]: 이것만은 꼭 알아두세요 (핵심 개념)\n- 왜 이 정보가 중요한지 2~3줄로 설명.\n- 핵심 정의 및 독자가 얻게 될 이점.\n\n> 💡 **한 줄 요약 팁**: \n> [독자가 바로 기억해야 할 핵심 팩트 한 줄]\n\n---\n\n## 2. [주제] 신청 자격 및 기준 (표로 한눈에 보기)\n복잡한 수치나 조건은 글로 길게 쓰면 지루합니다. 아래 표로 간결하게 정리했습니다.\n\n| 구분 | 지원 대상 | 소득 인정액 기준 | 비고 |\n| :--- | :--- | :--- | :--- |\n| **단독 가구** | 만 65세 이상 | 000만 원 이하 | 재산 공제 적용 |\n| **부부 가구** | 부부 모두 해당 | 000만 원 이하 | 20% 감액 주의 |\n\n---\n\n## 3. 실제로 제가 신청해 보며 느낀 주의사항 (실전 팁)\n(여기에 신청 화면 캡처나 관련 서류 사진 삽입)\n\n실제 주민센터나 홈페이지에서 신청할 때 많은 분들이 실수하는 부분이 있습니다.\n- **첫째**: [주의사항 1]\n- **둘째**: [주의사항 2 - 필자의 실제 에피소드]\n\n---\n\n## 💡 마무리 및 3줄 요약\n오늘 알아본 내용을 딱 3줄로 정리해 드립니다.\n1. [핵심 요약 1]\n2. [핵심 요약 2]\n3. [핵심 요약 3]\n\n더 궁금하신 점이 있으시다면 편하게 **댓글**로 남겨주세요. 제가 아는 선에서 정성껏 답변드리겠습니다. 도움이 되셨다면 **공감(하트)** 한 번 부탁드립니다!\n```\n\n---\n\n## 템플릿 2: 내돈내산 제품/서비스 리뷰형 (제휴마케팅 & 협찬)\n> **목적**: 쿠팡 파트너스 구매 전환율 극대화, 신뢰도 확보\n\n```markdown\n# [솔직 후기] [제품명] 3달 직접 써보고 느낀 장단점 (내돈내산)\n\n(여기에 제품 실물 사진 삽입)\n\n나이가 들수록 건강이나 취미 장비는 아무거나 쓸 수 없죠.\n광고가 너무 많아 어떤 제품을 골라야 할지 2주 넘게 고민하다가, 결국 제 돈 주고 직접 구매한 **[제품명]**!\n\n벌써 3달째 매일 사용하고 있는데요, 광고에서는 절대 알려주지 않는 **진짜 솔직한 장점과 단점**을 가감 없이 털어놓겠습니다.\n\n---\n\n## 1. 수많은 제품 중 이 제품을 선택한 이유\n- 구매 전 내가 겪었던 불편함(Pain Point).\n- 타사 제품 대비 가격, 스펙, 브랜드 신뢰도 비교.\n\n---\n\n## 2. 3달 실사용자가 느낀 강력한 장점 3가지\n(여기에 실제 사용 중인 사진 2~3장 삽입)\n\n1. **[장점 1 - 편의성]**: 구체적인 일상 속 변화.\n2. **[장점 2 - 내구성/품질]**: 시니어 관점에서의 편리함.\n3. **[장점 3 - 가성비]**: 돈이 아깝지 않았던 이유.\n\n---\n\n## 3. 솔직히 이건 좀 아쉽다 (단점 및 주의점)\n- 단점을 숨기지 않고 1~2가지 언급해야 리뷰의 신뢰도가 200% 올라갑니다.\n- 단점을 극복하는 나만의 꿀팁 추가.\n\n---\n\n## 4. 이런 분들께 추천합니다 & 최저가 정보\n- **추천 대상**: [어떤 상황의 독자에게 딱 맞는지]\n- **비추천 대상**: [이런 분은 사지 마세요]\n\n> 📌 **제품 상세 정보 & 최저가 확인하기**:\n> [제휴마케팅 링크 또는 구매처 링크 삽입]\n> *(※ 본 포스팅은 직접 구매하여 사용한 후기이며, 일정액의 수수료를 제공받을 수 있습니다.)*\n```\n\n---\n\n## 템플릿 3: A vs B 비교 분석형\n> **목적**: 구매 직전 또는 선택의 기로에 선 독자의 폭발적인 클릭 유도\n\n```markdown\n# [A] vs [B] 전격 비교: 60대 은퇴자에게 진짜 맞는 선택은?\n\n(여기에 두 대상을 비교하는 이미지 삽입)\n\n은퇴 후 [주제]를 준비하면서 **[A]**와 **[B]** 사이에서 밤잠 설칠 만큼 고민하시는 분들 많으시죠?\n둘 다 각자의 장단점이 뚜렷해서 내 상황에 맞지 않는 것을 선택하면 시간과 돈을 낭비하기 쉽습니다.\n\n오늘은 두 선택지의 **핵심 차이점, 비용, 실사용 만족도**를 한눈에 비교해 드립니다.\n\n---\n\n## 1. 한눈에 보는 A vs B 스펙 & 비용 비교표\n\n| 비교 기준 | [A] 선택지 | [B] 선택지 | 추천 대상 |\n| :--- | :--- | :--- | :--- |\n| **초기 비용** | 00만 원 선 | 00만 원 선 | 가성비 원할 때 |\n| **유지 관리** | 쉬움 | 전문 관리 필요 | 여유 시간 많을 때 |\n| **만족도/장점** | [핵심 장점] | [핵심 장점] | [성향별 추천] |\n\n---\n\n## 2. [A]를 선택해야 하는 사람 (이런 분께 추천)\n- 특징 1\n- 특징 2\n\n## 3. [B]를 선택해야 하는 사람 (이런 분께 추천)\n- 특징 1\n- 특징 2\n\n---\n\n## 💡 결론: 저의 최종 선택과 이유\n제 개인적인 추천은 [A/B]입니다. 그 이유는...\n독자 여러분의 현재 상황은 어떠신가요? 여러분의 선택을 댓글로 남겨주세요!\n```\n"}, "guide-writing-style": {"metadata": {"id": "guide-writing-style", "category": "05. 글쓰기 템플릿 & 가이드라인", "category_icon": "✒️", "title": "공통 문체 및 글쓰기 원칙 (guidelines/writing-style)", "file_path": "guidelines/writing-style.md", "url_path": "../guidelines/writing-style.md", "desc": "결론 선제시, 가짜 경험 금지, 플랫폼별 톤앤매너 구분"}, "content": "# Writing Style Guidelines (공통 문체 및 글쓰기 원칙)\n\n## 1. 핵심 글쓰기 철학\n1. **결론부터 먼저(Answer First)**: 독자가 검색창에 입력한 질문의 핵심 답을 첫 2~3문단 안에 명확히 제시합니다.\n2. **가짜 경험담 금지(No Fake Experience)**: AI가 임의로 만들어낸 허구 경험(*\"제가 어제 주민센터에 다녀왔는데...\"*)은 절대 쓰지 않습니다. 실제로 경험한 내용만 1인칭으로 쓰고, 나머지는 공식 기준과 객관적 절차로 서술합니다.\n3. **단정적 조언 지양**: 연금, 세금, 금융, 건강 주제는 개인별 소득·재산·연령·건강 상태에 따라 결과가 달라지므로 가정 조건을 명시하고 공식 기관 확인 경로를 함께 안내합니다.\n\n---\n\n## 2. 플랫폼별 문체(Tone & Manner) 구분\n\n| 항목 | 🟢 네이버 블로그 (`품미인생`) | 🟠 티스토리 블로그 (`똑똑한 생활탐구`) |\n| :--- | :--- | :--- |\n| **화자 페르소나** | 30~40년 경륜을 지닌 따뜻하고 현명한 5060 이웃 (`품미인생`) | 정확성과 실용성을 중시하는 신뢰도 높은 정보 에디터 |\n| **문장 어미** | `~입니다`, `~해보세요`, `~하시길 바랍니다` (부드러운 대화체) | `~합니다`, `~확인할 수 있습니다` (간결하고 명료한 설명체) |\n| **시각 요소** | 인용구 박스, 핵심 불릿 포인트, 구분선, 공감 질문 | **단계별 번호(1단계~4단계)**, **조건별 마크다운 비교표**, 공식 링크 |\n| **금지 표현** | `#은퇴블로그` 해시태그, 과도한 이모지 남발 | 상투적 인사말 반복, 출처 없는 통계, 키워드 스터핑(반복 도배) |\n"}, "guide-naver-blog": {"metadata": {"id": "guide-naver-blog", "category": "05. 글쓰기 템플릿 & 가이드라인", "category_icon": "🟢", "title": "네이버 블로그 가이드라인 (guidelines/naver-blog)", "file_path": "guidelines/naver-blog.md", "url_path": "../guidelines/naver-blog.md", "desc": "C-Rank & D.I.A 스마트블록 상위 노출 및 해시태그 규칙"}, "content": "# Naver Blog Guidelines (네이버 블로그 C-Rank & D.I.A 최적화 규칙)\n\n## 1. 운영 기본 원칙\n- **블로그명 / 지기명**: `품미인생(品味人生)` — *\"통장은 든든하게 지키고, 입맛은 풍요롭게!\"*\n- **발행 주기**: 하루 3~5편 (실시간 검색어 1위 메인 글 + 품미인생 5대 핵심 테마 연관 글)\n- **권장 분량**: 공백 포함 약 1,500 ~ 2,000자 (예상 읽는 시간 3분~3분 30초)\n\n---\n\n## 2. 스마트블록 및 D.I.A 상위 노출 규칙\n1. **제목 구성**: 핵심 키워드를 제목 앞쪽 15자 이내에 배치하고, 독자가 얻을 수 있는 혜택(`실전 팁 3가지`, `체크포인트`)을 구체화합니다.\n2. **소제목 구조**: 본문 내 소제목(H2/H3)을 3~4개 배치하여 네이버 요약 봇이 문서 구조를 쉽게 파악하도록 합니다.\n3. **스마트에디터 ONE 서식 호환**:\n   - 네이버 에디터는 마크다운 기호(`**`, `###`)를 텍스트 그대로 노출하므로, 반드시 포스트 뷰어(`.html`)의 **[🟢 네이버 스마트에디터 서식 복사]** 기능을 사용해 Rich HTML 서식으로 붙여넣습니다.\n4. **해시태그 정책**:\n   - `#은퇴블로그` 태그는 사용하지 않습니다.\n   - 기본 필수 태그: `#인생2막 #품미인생 #노후자산관리 #생활꿀팁 #디지털연금` + 당일 주제 키워드 3~5개\n"}, "guide-tistory-seo": {"metadata": {"id": "guide-tistory-seo", "category": "05. 글쓰기 템플릿 & 가이드라인", "category_icon": "🟠", "title": "티스토리 SEO & 애드센스 가이드 (guidelines/tistory-seo)", "file_path": "guidelines/tistory-seo.md", "url_path": "../guidelines/tistory-seo.md", "desc": "구글 E-E-A-T 7대 규칙, 비교표, 서치 콘솔 색인 관리"}, "content": "# Tistory SEO & AdSense Guidelines (티스토리 구글 검색 & 애드센스 최적화 규칙)\n\n## 1. 운영 기본 원칙\n- **블로그 지향점**: 구글(Google) 및 다음(Daum) 검색 유입 기반의 장기 정보 자산 축적 + **Google AdSense** 수익화\n- **발행 목표**: 초기 **하루 1편** 또는 **주 5편** (일일 30분 투자 루틴)\n- **카테고리 5대 구성**:\n  1. `은퇴·연금·생활비` (30%)\n  2. `AI·IT 활용법` (25%)\n  3. `제품 비교·사용법` (25%)\n  4. `골프·취미` (10%)\n  5. `반려동물·생활정보` (10%)\n\n---\n\n## 2. 구글 SEO (E-E-A-T) 최적화 7대 규칙\n1. **검색 의도(Search Intent) 직결 제목**: 추상적인 감성 제목 대신 `~ 조회 방법`, `A vs B 수수료·세금 비교표`, `~ 오류 해결 순서 4단계`처럼 검색 질문과 직결되는 제목을 작성합니다.\n2. **도입부 핵심 요약 선제시**: 첫 문단 바로 아래에 인용구(`>`)로 **핵심 답변 요약**을 배치해 이탈률을 낮춥니다.\n3. **시멘틱 헤딩(H2 / H3) 구조**: 본문 소제목은 반드시 `## (H2)`와 `### (H3)` 계층 구조를 지킵니다.\n4. **구조화된 비교표(Markdown Table) 필수 포함**: 구글 검색 스니펫(Featured Snippet) 노출에 유리하도록 조건별·제품별·제도별 비교표를 1개 이상 포함합니다.\n5. **공식 출처 외부 링크(Outbound Link) 연결**: 주장이나 계산 기준 근처 및 하단 참고 자료에 공단·정부·제조사 공식 URL을 연결해 문서 신뢰도(Trustworthiness)를 높입니다.\n6. **플랫폼 간 중복 원고 금지**: 네이버 블로그에 올린 글을 그대로 복사해 게시하지 않고, 티스토리 전용 7단계 구조로 새롭게 작성합니다.\n7. **서치 콘솔 색인 관리**: Google Search Console에 `/sitemap.xml`과 `/rss`를 등록하고 주기적으로 색인 상태와 노출 검색어를 점검합니다.\n"}, "guide-wordpress-seo": {"metadata": {"id": "guide-wordpress-seo", "category": "05. 글쓰기 템플릿 & 가이드라인", "category_icon": "🔵", "title": "워드프레스 SEO & 구텐베르크 가이드 (guidelines/wordpress-seo)", "file_path": "guidelines/wordpress-seo.md", "url_path": "../guidelines/wordpress-seo.md", "desc": "Rank Math / Yoast 온페이지 SEO 8대 규칙 및 FAQ 스키마 가이드"}, "content": "# WordPress SEO & Gutenberg Guidelines (워드프레스 온페이지 SEO 8대 규칙)\n\n## 1. 워드프레스 온페이지 SEO (Rank Math / Yoast 기준) 필수 규칙\n\n1. **영문 URL 슬러그(Slug) 설정**:\n   - 한글 URL은 복사 시 인코딩이 길어지므로, 핵심 키워드를 담은 3~5단어 영문 하이픈 슬러그를 권장합니다 (예: `/national-pension-expected-payout-guide`).\n2. **Focus Keyphrase 배치**:\n   - 핵심 키워드를 ① SEO 제목 앞부분, ② 메타 설명(Meta Description), ③ 첫 번째 문단, ④ 최소 1개 이상의 H2 소제목에 자연스럽게 포함합니다.\n3. **메타 설명(Meta Description) 150~160자 준수**:\n   - 검색 결과에서 독자가 클릭하고 싶도록 질문의 핵심 답변과 포함 정보(비교표, 신청 절차 등)를 155자 내외로 요약합니다.\n4. **구텐베르크 표(Table) 및 목록(List) 블록 활용**:\n   - 구글 Featured Snippet(강조 스니펫) 선점을 위해 단계별 순서(`<ol>`)와 비교표(`<table>`)를 적극 활용합니다.\n5. **FAQ 섹션 상시 포함**:\n   - 본문 하단에 독자가 추가로 궁금해하는 연관 질문 3가지를 `Q. / A.` 형태로 정리하여 롱테일 검색어를 흡수합니다.\n6. **신뢰할 수 있는 외부 링크(Outbound Link) & 내부 링크(Internal Link)**:\n   - 정부·공단·제조사 공식 사이트로 연결되는 외부 링크 2~3개와 내 워드프레스 내 관련 글 내부 링크를 연결합니다.\n7. **플랫폼 간 100% 원고 분리**:\n   - 네이버·티스토리에 발행한 글과 동일한 주제를 다루더라도 제목, 슬러그, 문단 구성, FAQ를 워드프레스 전용으로 완전히 새로 구성합니다.\n"}, "guide-source-policy": {"metadata": {"id": "guide-source-policy", "category": "05. 글쓰기 템플릿 & 가이드라인", "category_icon": "🏛️", "title": "공식 출처 검증 및 인용 정책 (guidelines/source-policy)", "file_path": "guidelines/source-policy.md", "url_path": "../guidelines/source-policy.md", "desc": "1순위 공신력 기관 목록 및 가정 조건·미확인 수치 처리 원칙"}, "content": "# Source Verification & Citation Policy (출처 검증 및 인용 정책)\n\n## 1. 1순위 신뢰 출처 (Primary Sources)\n블로그의 모든 숫자, 세율, 수수료, 자격 요건, 신청 절차는 아래 1순위 공식 출처를 최우선으로 참고합니다.\n\n- **연금·복지·건강보험**:\n  - 국민연금공단 (`https://www.nps.or.kr/`)\n  - 국민건강보험공단 (`https://www.nhis.or.kr/`)\n  - 복지로 (`https://www.bokjiro.go.kr/`)\n  - 고용24 / 정부24 (`https://www.gov.kr/`)\n- **금융·세금·거시경제**:\n  - 금융감독원 통합연금포털 (`https://100lifeplan.fss.or.kr/`)\n  - 국세청 홈택스 (`https://www.hometax.go.kr/`)\n  - 한국은행 경제통계시스템 ECOS (`https://ecos.bok.or.kr/`)\n  - 한국거래소 KRX 정보데이터시스템 (`http://marketdata.krx.co.kr/`)\n- **IT·플랫폼·소비자 정보**:\n  - Google 검색 센터 (`https://developers.google.com/search/docs?hl=ko`)\n  - Google AdSense 고객센터 (`https://support.google.com/adsense/?hl=ko`)\n  - Apple / Samsung / OpenAI 공식 고객지원 페이지\n  - 한국소비자원 소비자24 (`https://www.consumer.go.kr/`)\n\n---\n\n## 2. 출처 표기 및 불확실 정보 처리 규칙\n1. **기준 시점 명시**: 정책이나 금리·수수료·세율은 연도별로 변경될 수 있으므로 반드시 `2026년 공식 안내 기준`처럼 확인 시점을 명시합니다.\n2. **가정 조건 명시**: 계산 예시를 들 때는 `(가정: 1969년생 이후, 정상 수령 만 65세 기준)`과 같이 전제 조건을 괄호나 표 하단 주석으로 밝힙니다.\n3. **미확인 사실 처리**: 공식 자료에서 즉시 확인되지 않는 수치는 절대 추측해 적지 않고 `[확인 필요]`로 표시하거나 *\"세부 금액은 개인별 가입 조건에 따라 달라지므로 공식 홈페이지 모의계산에서 확인하시기 바랍니다\"*로 안내합니다.\n4. **이미지 및 인용 저작권 준수**: 타 블로그나 뉴스 기사의 이미지를 무단 전재하지 않으며, 직접 제작한 비교표·체크리스트 또는 공식 사이트 안내 경로 설명으로 대체합니다.\n"}, "topic-backlog": {"metadata": {"id": "topic-backlog", "category": "06. 주제 백로그 & 주간 리뷰", "category_icon": "🗂️", "title": "유망 주제 대기열 (topics/topic-backlog)", "file_path": "topics/topic-backlog.md", "url_path": "../topics/topic-backlog.md", "desc": "5대 카테고리별 100점 평가 완료된 미작성 주제 목록"}, "content": "# Topic Backlog (네이버 · 티스토리 미작성 유망 주제 대기열)\n\n> **운영 방법**: 매일 Google Trends와 실시간 검색어, 또는 일상 속 궁금증에서 발굴한 주제를 아래 5대 카테고리별로 적립해 두고, 100점 평가 점수가 높은 순서대로 하나씩 꺼내 작성합니다.\n\n---\n\n## 1. AI · IT 활용법 (초기 최우선 추천 주제군 · 25%)\n\n| 우선순위 | 평가 점수 | 검색 질문 / 티스토리 주제 후보 | 네이버 블로그 연계 주제 방향 | 참고 공식 출처 | 상태 |\n| :---: | :---: | :--- | :--- | :--- | :---: |\n| 1 | **96/100** | ChatGPT 등 AI로 블로그 초안 작성 후 사실관계(팩트체크) 검증하는 5단계 방법 | 5060을 위한 AI 스마트 라이프 활용기 | Google 검색 센터, OpenAI Help | ✅ 작성완료 (2026-10-25) |\n| 2 | **92/100** | 맥(Mac)에서 Apple 계정(Apple ID) 로그인 오류·무한 로딩 해결하는 5단계 순서 | 맥북·아이폰 처음 쓸 때 당황했던 순간과 해결 팁 | Apple 공식 고객지원 (`support.apple.com`) | ✅ 작성완료 (2026-10-25) |\n| 3 | **90/100** | GitHub와 Vercel을 이용해 무료로 개인 웹페이지·포털 배포하는 4단계 방법 | 나만의 디지털 작업실 웹페이지 만든 이야기 | GitHub Docs, Vercel Docs | ✅ 작성완료 (2026-10-25) |\n| 4 | **88/100** | 티스토리 블로그 Google Search Console 등록 및 `/sitemap.xml` · `/rss` 제출 방법 | 블로그 검색 유입을 늘리는 기본 설정 습관 | Google Search Console 고객센터 | ✅ 작성완료 (2026-10-25) |\n| 5 | **84/100** | 스마트폰(갤럭시·아이폰) 글자 크기·돋보기·보이스피싱 차단 초기 설정 비교 | 부모님·시니어 스마트폰 필수 안전 설정 3가지 | 삼성전자·Apple 공식 안내 | ⏳ 대기 |\n\n---\n\n## 2. 은퇴 · 연금 · 생활비 (핵심 고단가 주제군 · 30%)\n\n| 우선순위 | 평가 점수 | 검색 질문 / 티스토리 주제 후보 | 네이버 블로그 연계 주제 방향 | 참고 공식 출처 | 상태 |\n| :---: | :---: | :--- | :--- | :--- | :---: |\n| 1 | **88/100** | 국민연금 예상 수령액 조회 방법 및 물가상승률 반영 기준 정리 | 경상수지·물가 뉴스 속 내 노후 연금 지키는 법 | 국민연금공단 (`nps.or.kr`) | ✅ 작성완료 (2026-10-25) |\n| 2 | **92/100** | 퇴직 후 건강보험료 계산 기준: 피부양자 등록 요건 vs 임의계속가입 vs 지역가입자 비교표 | 은퇴 직후 가장 놀라는 건보료 폭탄 피하는 현실 팁 | 국민건강보험공단 (`nhis.or.kr`) | ✅ 작성완료 (2026-10-25) |\n| 3 | **90/100** | 연금저축펀드 vs 개인형 퇴직연금( 식: Google Trends 상승 검색어를 5대 기준(100점 만점)으로 채점하여 장기 검색형 질문 해결 글(7단계 표준 구조, 조건별 비교표, 공식 출처 포함) 작성 개시\n- **⚙️ 통합 워크플로우 (`workflow/`)**:\n  - `workflow/`, `prompts/`, `guidelines/`, `topics/`, `logs/publishing-log.csv` 표준 디렉토리 및 일별 워크플로우 작업실 구축 완료\n\n### 2. 주간 핵심 점검 5대 항목\n1. **노출 및 클릭 발생 주제**:\n   - 네이버: 금 시세, 엔화 환율, 건강검진, 제철 식도락 등 5060 실생활 밀착 키워드 반응 우수\n   - 티스토리: AI 초안 팩트체크 방법(96점), 국민연금 예상 수령액 조회 및 물가 반영 기준(88점), 순금 24K vs 골드바 vs KRX 금현물 비교표(80점) 첫 발행\n2. **개선할 점 (제목 및 본문 구성)**:\n   - 단기 스포츠·연예 검색어는 티스토리에서 제외(보류 판정)하고, 네이버와 티스토리의 원고 구성을 완벽히 분리하는 투트랙 기준 확립\n3. **지속 검색 기대 콘텐츠**:\n   - 국민연금 조기·정상·연기 수령률 비교표 및 KRX 금현물 수수료·부가세 비교표\n4. **다음 주(10월 5주 차) 확장 예정 주제 5선**:\n   - ① 맥(Mac) Apple 계정 로그인 오류 해결 순서 (`AI·IT 활용법`)\n   - ② 퇴직 후 건강보험료 피부양자 vs 임의계속가입 비교 (`은퇴·연금·생활비`)\n   - ③ 연금저축펀드 vs IRP 세액공제·수령 조건 비교 (`은퇴·연금·생활비`)\n   - ④ GitHub + Vercel 무료 사이트 배포 방법 (`AI·IT 활용법`)\n   - ⑤ 파크골프채 공인 인증 확인법 및 스펙 비교 (`골프·취미`)\n5. **보완 및 유지 관리**:\n   - 티스토리 개설 후 Google Search Console에 `/sitemap.xml` 및 `/rss` 제출 상태 점검 예정\n"}, "memo-ideas": {"metadata": {"id": "memo-ideas", "category": "아이디어 메모", "category_icon": "📝", "title": "블로그 아이디어 & 영감 메모장", "file_path": "docs/notes/memo-ideas.md", "url_path": "notes/memo-ideas.md", "desc": "일상 속 경험과 아이디어를 메모하고 AI 초안으로 연결하는 스크래치패드"}, "content": "# 📝 블로그 아이디어 & 영감 메모장 (Idea Scratchpad)\n\n일상 속에서 떠오르는 아이디어, 나누고 싶은 경험, 뉴스 기사를 보며 든 생각을 자유롭게 적어두는 공간입니다.  \n적어둔 메모를 복사해서 AI에게 **\"이 메모를 바탕으로 블로그 글 초안을 써줘\"**라고 요청하면 됩니다.\n\n---\n\n## 💡 아이디어 메모 목록\n\n### [아이디어 1] 수도권 파3 골프 연습장 실전 비교 후기\n- **배경/계기**: 정규홀 라운드 비용이 너무 올라서 주말에 파3 숏게임 연습장을 찾게 됨.\n- **핵심 경험**:\n  - 남서울CC 제2연습장 (7km): 정규홀급 에이프런, 벙커샷 연습에 최고.\n  - 미리내 파3 (양평): 매트가 아닌 천연잔디 티샷 가능 & 2볼 플레이 공식 허용이라 웨지 어프로치 실전 감각 키우기에 최상.\n  - 조이프라자: 파3 치고 온천 사우나 무료라 가성비 최고.\n- **타겟 독자**: 5060 골퍼, 숏게임 스코어 줄이고 싶은 아마추어 골퍼.\n- **예상 제목**: `주말 파3 골프장 어디가 좋을까? 분당 인근 가성비 숏게임 연습장 3곳 솔직 비교`\n- **상태**: [ ] 기획 중 / [ ] 초안 작성 / [ ] 발행 완료\n\n---\n\n### [아이디어 2] 은퇴 후 건강보험료 지역가입자 전환 시 깜짝 놀란 사연 & 절세 팁\n- **배경/계기**: 직장 퇴직 후 첫 건강보험료 고지서 받고 금액에 깜짝 놀랐던 기억.\n- **핵심 경험**:\n  - 임의계속가입 제도 신청으로 직장 다닐 때 내던 금액 수준으로 3년간 방어한 이야기.\n  - 피부양자 자격 요건과 주의할 점.\n- **타겟 독자**: 퇴직을 앞두거나 최근 퇴직한 5060 직장인.\n- **예상 제목**: `퇴직 후 건강보험료 폭탄 피하는 법: 임의계속가입 신청 후기 (월 15만원 아낌)`\n- **상태**: [ ] 기획 중 / [ ] 초안 작성 / [ ] 발행 완료\n\n---\n\n### [아이디어 3] 은퇴 남자의 초간단 15분 아침 집밥 루틴\n- **배경/계기**: 은퇴 후 '삼식이' 소리 안 듣고 스스로 건강 챙기기 프로젝트.\n- **핵심 경험**:\n  - 오트밀 + 두유 + 견과류 + 삶은 달걀 + 사과 조합.\n  - 설거지거리 안 나오는 조리 루틴. 아내도 대만족.\n- **타겟 독자**: 은퇴 남성 및 5060 주부 이웃.\n- **예상 제목**: `아내 눈치 안 보고 10분 만에 끝내는 은퇴 남자의 건강 아침 식단 루틴`\n- **상태**: [ ] 기획 중 / [ ] 초안 작성 / [ ] 발행 완료\n\n---\n\n## ✍️ 새 메모 추가하기 (템플릿)\n\n```markdown\n### [아이디어 N] 주제 제목\n- **배경/계기**: \n- **핵심 경험/데이터**: \n- **타겟 독자**: \n- **예상 제목**: \n- **상태**: [ ] 기획 중 / [ ] 초안 작성 / [ ] 발행 완료\n```\n"}};

con": "🔵", "title": "워드프레스 SEO & 구텐베르크 가이드 (guidelines/wordpress-seo)", "file_path": "guidelines/wordpress-seo.md", "url_path": "../guidelines/wordpress-seo.md", "desc": "Rank Math / Yoast 온페이지 SEO 8대 규칙 및 FAQ 스키마 가이드"}, {"id": "guide-source-policy", "category": "05. 글쓰기 템플릿 & 가이드라인", "category_icon": "🏛️", "title": "공식 출처 검증 및 인용 정책 (guidelines/source-policy)", "file_path": "guidelines/source-policy.md", "url_path": "../guidelines/source-policy.md", "desc": "1순위 공신력 기관 목록 및 가정 조건·미확인 수치 처리 원칙"}, {"id": "topic-backlog", "category": "06. 주제 백로그 & 주간 리뷰", "category_icon": "🗂️", "title": "유망 주제 대기열 (topics/topic-backlog)", "file_path": "topics/topic-backlog.md", "url_path": "../topics/topic-backlog.md", "desc": "5대 카테고리별 100점 평가 완료된 미작성 주제 목록"}, {"id": "topic-calendar", "category": "06. 주제 백로그 & 주간 리뷰", "category_icon": "📅", "title": "주간·월간 발행 캘린더 (topics/topic-calendar)", "file_path": "topics/topic-calendar.md", "url_path": "../topics/topic-calendar.md", "desc": "요일별 네이버·티스토리 발행 리듬 및 차주 예정 스케줄"}, {"id": "weekly-review", "category": "06. 주제 백로그 & 주간 리뷰", "category_icon": "📊", "title": "주간 블로그 성과 리뷰 (logs/weekly-review)", "file_path": "logs/weekly-review.md", "url_path": "../logs/weekly-review.md", "desc": "주간 발행 요약, 노출·클릭 점검 및 차주 확장 주제 기록"}, {"id": "memo-ideas", "category": "아이디어 메모", "category_icon": "📝", "title": "블로그 아이디어 & 영감 메모장", "file_path": "docs/notes/memo-ideas.md", "url_path": "notes/memo-ideas.md", "desc": "일상 속 경험과 아이디어를 메모하고 AI 초안으로 연결하는 스크래치패드"}];

    let activeDocId = "readme";

    marked.setOptions({
      gfm: true,
      breaks: true,
      highlight: function(code, lang) {
        const language = hljs.getLanguage(lang) ? lang : 'plaintext';
        return hljs.highlight(code, { language }).value;
      }
    });

    function renderNav(filter = "") {
      const navEl = document.getElementById("navList");
      navEl.innerHTML = "";

      let currentCat = "";
      DOC_METADATA.forEach(doc => {
        if (filter) {
          const q = filter.toLowerCase();
          const matchTitle = doc.title.toLowerCase().includes(q);
          const matchDesc = doc.desc.toLowerCase().includes(q);
          const matchCat = doc.category.toLowerCase().includes(q);
          if (!matchTitle && !matchDesc && !matchCat) return;
        }

        if (doc.category !== currentCat) {
          currentCat = doc.category;
          const catHeader = document.createElement("div");
          catHeader.className = "nav-category";
          catHeader.innerHTML = `${doc.category_icon} ${doc.category}`;
          navEl.appendChild(catHeader);
        }

        const item = document.createElement("div");
        item.className = "nav-item" + (doc.id === activeDocId ? " active" : "");
        item.onclick = (e) => {
          if (e.target.tagName.toLowerCase() === 'a') return;
          loadDoc(doc.id);
        };

        const titleSpan = document.createElement("span");
        titleSpan.className = "nav-item-title";
        titleSpan.textContent = doc.title;
        item.appendChild(titleSpan);

        // Direct link to the .md file
        const directLink = document.createElement("a");
        directLink.className = "nav-file-link";
        directLink.href = doc.url_path;
        directLink.target = "_blank";
        directLink.title = `원본 파일 열기: ${doc.url_path}`;
        directLink.innerHTML = "🔗 md";
        directLink.onclick = (e) => e.stopPropagation();
        item.appendChild(directLink);

        navEl.appendChild(item);
      });
    }

    async function loadDoc(id) {
      const doc = DOCS_DATA[id];
      if (!doc) return;

      activeDocId = id;
      renderNav(document.getElementById("searchInput").value);

      document.getElementById("currentCategory").textContent = `${doc.metadata.category_icon} ${doc.metadata.category}`;
      document.getElementById("currentPath").textContent = doc.metadata.file_path;

      const rawLink = document.getElementById("rawMdLink");
      rawLink.href = doc.metadata.url_path;
      
      const downloadLink = document.getElementById("downloadMdLink");
      downloadLink.href = doc.metadata.url_path;
      downloadLink.download = doc.metadata.file_path.split('/').pop();

      let mdText = doc.content;

      if (window.location.protocol.startsWith("http")) {
        try {
          const res = await fetch(doc.metadata.url_path);
          if (res.ok) {
            mdText = await res.text();
          }
        } catch(e) {
          console.warn("Using embedded fallback", e);
        }
      }

      const html = marked.parse(mdText);
      const container = document.getElementById("contentView");
      container.innerHTML = html;

      container.querySelectorAll("pre").forEach(pre => {
        const btn = document.createElement("button");
        btn.className = "copy-btn";
        btn.textContent = "복사";
        btn.onclick = () => {
          const code = pre.querySelector("code") ? pre.querySelector("code").innerText : pre.innerText;
          navigator.clipboard.writeText(code).then(() => {
            btn.textContent = "✓ 복사됨!";
            setTimeout(() => { btn.textContent = "복사"; }, 1500);
          });
        };
        pre.appendChild(btn);
      });

      document.querySelector(".content-area").scrollTop = 0;
      window.location.hash = id;
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      renderNav(e.target.value);
    });

    const themeBtn = document.getElementById("themeBtn");
    let isDark = false;
    themeBtn.addEventListener("click", () => {
      isDark = !isDark;
      document.body.setAttribute("data-theme", isDark ? "dark" : "light");
      const hljsTheme = document.getElementById("hljs-theme");
      if (isDark) {
        hljsTheme.href = "https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css";
      } else {
        hljsTheme.href = "https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css";
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      const hash = window.location.hash.replace("#", "");
      if (hash && DOCS_DATA[hash]) {
        loadDoc(hash);
      } else {
        loadDoc("readme");
      }
    });
  </script>
